<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07101d">
<title>🇧🇬 Български новини</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#07101d;color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{padding:24px 18px 40px}.wrap{max-width:900px;margin:auto}
h1{font-size:34px;margin:4px 0 6px}.status{color:#91a3bd;font-size:16px;margin-bottom:24px}
.section{margin-bottom:34px}.title{font-size:30px;font-weight:800;margin:0 0 12px}
.card{border:2px solid #304362;border-radius:30px;padding:8px 22px;background:#07101d}
.item{padding:17px 0;border-bottom:1px solid #263751}.item:last-child{border-bottom:0}
.item a{display:block;color:#f5f7fb;text-decoration:none;font-size:22px;line-height:1.3;font-weight:700}
.meta{margin-top:7px;color:#8ea0bb;font-size:14px}.err{color:#ffb0b0;font-size:18px;padding:18px 0}
.footer{color:#8ea0bb;font-size:16px;margin-top:10px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
<h1>🇧🇬 Български новини</h1>
<div id="status" class="status">Зареждане на последните новини…</div>

<section class="section">
<div class="title">📰 Новини</div>
<div class="card"><div id="news"></div></div>
</section>

<section class="section">
<div class="title">⚽ Спорт</div>
<div class="card"><div id="sport"></div></div>
</section>

<div class="footer">Автоматично обновяване: всяка 1 минута • Без снимки</div>
</div>

<script>
const SOURCES={
 news:{
   google:"https://news.google.com/rss/search?q=site%3Adariknews.bg&hl=bg&gl=BG&ceid=BG%3Abg",
   old:"https://dariknews.bg/rss.php",
   key:"dash_darik_4"
 },
 sport:{
   google:"https://news.google.com/rss/search?q=site%3Agong.bg&hl=bg&gl=BG&ceid=BG%3Abg",
   old:"https://gong.bg/rss",
   key:"dash_gong_4"
 }
};

function esc(s){
 return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function strip(s){
 const d=document.createElement("div"); d.innerHTML=s||"";
 return (d.textContent||d.innerText||"").replace(/\s+/g," ").trim();
}
function parseDate(s){
 if(!s)return "";
 const d=new Date(s); if(isNaN(d))return "";
 return d.toLocaleString("bg-BG",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
}
function normalize(a){
 return (a||[]).map(x=>({
  title:strip(x.title),
  link:x.link||x.guid||"",
  date:x.pubDate||x.published||x.isoDate||""
 })).filter(x=>x.title&&x.link).slice(0,12);
}
async function getJSON(url){
 const u="https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(url)+"&count=12&cb="+Date.now();
 const r=await fetch(u,{cache:"no-store"});
 if(!r.ok)throw Error("HTTP "+r.status);
 const j=await r.json();
 if(!j.items||!j.items.length)throw Error("empty");
 return normalize(j.items);
}
async function getXML(url){
 const r=await fetch(url+"?cb="+Date.now(),{cache:"no-store"});
 if(!r.ok)throw Error("HTTP "+r.status);
 const t=await r.text();
 const x=new DOMParser().parseFromString(t,"text/xml");
 return normalize([...x.querySelectorAll("item")].map(n=>({
  title:n.querySelector("title")?.textContent,
  link:n.querySelector("link")?.textContent,
  pubDate:n.querySelector("pubDate")?.textContent
 })));
}
async function load(key,id){
 const s=SOURCES[key];
 try{
   // Google News RSS is used first because it reflects the current
   // "latest" pages even when the media site's old RSS endpoint changes.
   let items=await getJSON(s.google);
   if(!items.length)throw Error("no items");
   localStorage.setItem(s.key,JSON.stringify(items));
   render(id,items);
   return true;
 }catch(e){
   try{
     const items=await getXML(s.old);
     if(items.length){
       localStorage.setItem(s.key,JSON.stringify(items));
       render(id,items); return true;
     }
   }catch(e2){}
   try{
     const old=JSON.parse(localStorage.getItem(s.key)||"null");
     if(old&&old.length){render(id,old);return false;}
   }catch(e3){}
   document.getElementById(id).innerHTML='<div class="err">Източникът временно не отговаря.</div>';
   return false;
 }
}
function render(id,items){
 document.getElementById(id).innerHTML=items.map(x=>`
 <div class="item">
  <a href="${esc(x.link)}" target="_blank" rel="noopener">${esc(x.title)}</a>
  ${x.date?`<div class="meta">${esc(parseDate(x.date))}</div>`:""}
 </div>`).join("");
}
async function refresh(){
 const status=document.getElementById("status");
 status.textContent="Обновяване на последните новини…";
 const [a,b]=await Promise.all([load("news","news"),load("sport","sport")]);
 const now=new Date().toLocaleTimeString("bg-BG",{hour:"2-digit",minute:"2-digit"});
 status.textContent=(a&&b)
   ? "Последно обновяване: "+now
   : "Последно обновяване: "+now+" • единият източник временно не отговаря";
}
refresh();
setInterval(refresh,60000);
</script>
</body>
</html>
