<!doctype html>

<html lang="bg">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>BG News Dashboard</title>

<style>

* {

  box-sizing: border-box;

}

body {

  margin: 0;

  background: #0b1220;

  color: #f7f9fc;

  font-family: Arial, Helvetica, sans-serif;

}

header {

  height: 13vh;

  padding: 18px 30px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  background: #111a2e;

  border-bottom: 1px solid #26324a;

}

.logo {

  font-size: 32px;

  font-weight: 700;

}

.clock {

  font-size: 34px;

  font-weight: 700;

  text-align: right;

}

.date {

  font-size: 18px;

  opacity: .75;

  margin-top: 3px;

}

main {

  height: 87vh;

  padding: 22px 30px;

  display: grid;

  grid-template-columns: 1.35fr 1fr;

  gap: 24px;

}

.column {

  min-width: 0;

  overflow: hidden;

}

.section-title {

  font-size: 22px;

  font-weight: 700;

  margin: 0 0 12px 0;

  color: #9fc5ff;

}

.news-list {

  display: flex;

  flex-direction: column;

  gap: 10px;

}

.story {

  display: block;

  text-decoration: none;

  color: #ffffff;

  background: #151f34;

  border: 1px solid #25314a;

  border-radius: 12px;

  padding: 13px 16px;

  transition: background .15s;

}

.story:hover,

.story:active {

  background: #22304a;

}

.story-title {

  font-size: 20px;

  font-weight: 700;

  line-height: 1.25;

}

.story-meta {

  margin-top: 7px;

  font-size: 14px;

  opacity: .65;

}

.empty {

  padding: 20px;

  background: #151f34;

  border-radius: 12px;

  opacity: .7;

}

.loading {

  padding: 20px;

  background: #151f34;

  border-radius: 12px;

  opacity: .7;

}

@media (max-width: 800px) {

  header {

    height: auto;

    padding: 14px 18px;

  }

  .logo {

    font-size: 23px;

  }

  .clock {

    font-size: 25px;

  }

  .date {

    font-size: 14px;

  }

  main {

    height: auto;

    grid-template-columns: 1fr;

    padding: 15px 18px;

  }

  .story-title {

    font-size: 18px;

  }

}

</style>

</head>

<body>

<header>

  <div class="logo">

    🇧🇬 Български новини

  </div>

  <div>

    <div id="clock" class="clock">--:--</div>

    <div id="date" class="date">--</div>

  </div>

</header>

<main>

  <section class="column">

    <div class="section-title">

      📰 Последни новини

    </div>

    <div id="news" class="news-list">

      <div class="loading">

        Зареждане на новините...

      </div>

    </div>

  </section>

  <section class="column">

    <div class="section-title">

      ⚽ Спорт

    </div>

    <div id="sports" class="news-list">

      <div class="loading">

        Зареждане на спортните новини...

      </div>

    </div>

  </section>

</main>

<script>

/* =========================================

   RSS FEEDS

   ========================================= */

const NEWS_FEEDS = [

  "https://www.dariknews.bg/rss",

  "https://www.dnes.bg/rss",

  "https://www.actualno.com/rss",

  "https://www.novinite.bg/rss"

];

const SPORT_FEEDS = [

  "https://sportal.bg/rss",

  "https://gong.bg/rss"

];

/* =========================================

   RSS PROXY

   ========================================= */

function rssUrl(feed) {

  return "https://api.allorigins.win/raw?url=" +

    encodeURIComponent(feed);

}

/* =========================================

   ESCAPE HTML

   ========================================= */

function escapeHtml(text) {

  return String(text || "")

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}

/* =========================================

   FORMAT DATE

   ========================================= */

function formatDate(value) {

  if (!value) return "";

  const d = new Date(value);

  if (isNaN(d.getTime())) {

    return "";

  }

  return d.toLocaleString("bg-BG", {

    day: "2-digit",

    month: "2-digit",

    hour: "2-digit",

    minute: "2-digit"

  });

}

/* =========================================

   LOAD ONE RSS FEED

   ========================================= */

async function loadFeed(feed) {

  try {

    const response = await fetch(rssUrl(feed), {

      cache: "no-store"

    });

    if (!response.ok) {

      throw new Error("RSS error");

    }

    const text = await response.text();

    const parser = new DOMParser();

    const xml = parser.parseFromString(

      text,

      "text/xml"

    );

    const items = [...xml.querySelectorAll("item")];

    return items.map(item => {

      const title =

        item.querySelector("title")?.textContent?.trim() || "";

      const link =

        item.querySelector("link")?.textContent?.trim() || "#";

      const date =

        item.querySelector("pubDate")?.textContent?.trim() || "";

      const source =

        feed

          .replace("https://", "")

          .split("/")[0]

          .replace("www.", "");

      return {

        title,

        link,

        date,

        source

      };

    });

  } catch (error) {

    console.log("RSS error:", feed, error);

    return [];

  }

}

/* =========================================

   LOAD MULTIPLE FEEDS

   ========================================= */

async function loadFeeds(feeds) {

  const results =

    await Promise.all(

      feeds.map(feed => loadFeed(feed))

    );

  let all = [];

  results.forEach(items => {

    all = all.concat(items);

  });

  return all;

}

/* =========================================

   SORT NEWS

   ========================================= */

function sortNews(items) {

  return items.sort((a, b) => {

    const da = new Date(a.date).getTime() || 0;

    const db = new Date(b.date).getTime() || 0;

    return db - da;

  });

}

/* =========================================

   CREATE STORY HTML

   ========================================= */

function story(item) {

  const title =

    escapeHtml(item.title);

  const source =

    escapeHtml(item.source);

  const date =

    formatDate(item.date);

  const link =

    item.link || "#";

  return `

    <a

      class="story"

      href="${link}"

      target="_blank"

      rel="noopener noreferrer"

    >

      <div class="story-title">

        ${title}

      </div>

      <div class="story-meta">

        ${source}

        ${date ? " • " + date : ""}

      </div>

    </a>

  `;

}

/* =========================================

   RENDER

   ========================================= */

function render(items, elementId) {

  const element =

    document.getElementById(elementId);

  if (!items.length) {

    element.innerHTML =

      '<div class="empty">Няма налични новини.</div>';

    return;

  }

  const limited =

    items.slice(0, 10);

  element.innerHTML =

    limited.map(story).join("");

}

/* =========================================

   LOAD ALL NEWS

   ========================================= */

async function loadNews() {

  const news =

    await loadFeeds(NEWS_FEEDS);

  const sports =

    await loadFeeds(SPORT_FEEDS);

  render(

    sortNews(news),

    "news"

  );

  render(

    sortNews(sports),

    "sports"

  );

}

/* =========================================

   CLOCK

   ========================================= */

function tick() {

  const now =

    new Date();

  document.getElementById("clock")

    .textContent =

      now.toLocaleTimeString(

        "bg-BG",

        {

          hour: "2-digit",

          minute: "2-digit"

        }

      );

  document.getElementById("date")

    .textContent =

      now.toLocaleDateString(

        "bg-BG",

        {

          weekday: "long",

          day: "numeric",

          month: "long"

        }

      );

}

/* =========================================

   START

   ========================================= */

tick();

setInterval(

  tick,

  1000

);

loadNews();

/* Обновяване на новините

   на всеки 5 минути */

setInterval(

  loadNews,

  300000

);

</script>

</body>

</html>
