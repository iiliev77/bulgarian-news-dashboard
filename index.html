<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🇧🇬 Български новини</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#061e2d;color:#eef6fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.wrap{max-width:1400px;margin:0 auto;padding:48px 34px}
h1{font-size:38px;margin:0 0 12px;font-weight:800}
.sub{font-size:22px;color:#91afbf;margin-bottom:12px}
.status{font-size:16px;color:#8ba7b7;margin-bottom:30px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:30px}
.card{border:2px solid #00bdf2;border-radius:30px;padding:30px;min-height:520px}
h2{font-size:31px;margin:0 0 22px}
.list{display:flex;flex-direction:column}
.item{display:block;text-decoration:none;color:#eef6fb;padding:18px 0;border-bottom:1px solid rgba(160,190,205,.2)}
.item:last-child{border-bottom:0}
.title{font-size:20px;line-height:1.3}
.meta{font-size:14px;color:#7899aa;margin-top:8px}
.loading,.error{color:#f0a6a6;font-size:17px;padding-top:10px}
button{background:#0b3045;color:#dff5ff;border:1px solid #2c8bad;border-radius:12px;padding:8px 14px;font-size:14px}
@media(max-width:800px){.grid{grid-template-columns:1fr}.wrap{padding:28px 18px}.card{padding:22px}h1{font-size:32px}.sub{font-size:18px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>🇧🇬 Български новини</h1>
  <div class="sub">Последни публикации от DarikNews.bg и dsport.bg · без RSS · автоматично обновяване</div>
  <div class="status" id="status">Зареждане...</div>

  <div class="grid">
    <section class="card">
      <h2>📰 Новини</h2>
      <div id="news" class="list"><div class="loading">Зареждане...</div></div>
    </section>

    <section class="card">
      <h2>⚽ Спорт</h2>
      <div id="sport" class="list"><div class="loading">Зареждане на dsport.bg...</div></div>
    </section>
  </div>
</div>

<script>
const PROXIES = [
  u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u) + '&t=' + Date.now(),
  u => 'https://corsproxy.io/?url=' + encodeURIComponent(u) + '&t=' + Date.now()
];

async function getPage(url){
  let last;
  for(const make of PROXIES){
    try{
      const r = await fetch(make(url), {cache:'no-store'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const text = await r.text();
      if(text && text.length > 1000) return text;
    }catch(e){ last=e; }
  }
  throw last || new Error('Няма достъп');
}

function clean(s){
  return s.replace(/\s+/g,' ').replace(/^\s+|\s+$/g,'');
}

function unique(items){
  const seen=new Set(), out=[];
  for(const x of items){
    const key=x.url;
    if(!key || seen.has(key)) continue;
    seen.add(key); out.push(x);
  }
  return out;
}

function extractDarik(html){
  const doc=new DOMParser().parseFromString(html,'text/html');
  const arr=[];
  for(const a of doc.querySelectorAll('a[href]')){
    const title=clean(a.textContent);
    const href=a.getAttribute('href')||'';
    if(title.length<25) continue;
    if(!/dariknews\.bg\/novini\/|^\/novini\//i.test(href)) continue;
    const url=new URL(href,'https://dariknews.bg/').href;
    arr.push({title,url});
  }
  return unique(arr).slice(0,10);
}

function extractDsport(html){
  const doc=new DOMParser().parseFromString(html,'text/html');
  const arr=[];
  for(const a of doc.querySelectorAll('a[href]')){
    const title=clean(a.textContent);
    const href=a.getAttribute('href')||'';
    if(title.length<18) continue;
    if(!/(dsport\.bg\/[^"' ]+~\d+\.html|^\/[^"' ]+~\d+\.html)/i.test(href)) continue;
    const url=new URL(href,'https://dsport.bg/').href;
    arr.push({title,url});
  }
  return unique(arr).slice(0,10);
}

function render(id,items,source){
  const el=document.getElementById(id);
  if(!items.length){
    el.innerHTML='<div class="error">Не бяха намерени публикации. Опитайте с обновяване.</div>';
    return;
  }
  el.innerHTML=items.map(x=>`
    <a class="item" href="${x.url}" target="_blank" rel="noopener">
      <div class="title">${escapeHtml(x.title)}</div>
      <div class="meta">${source} · актуално</div>
    </a>`).join('');
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function load(){
  const status=document.getElementById('status');
  status.textContent='Обновяване...';
  const results=await Promise.allSettled([
    getPage('https://dariknews.bg/novini'),
    getPage('https://dsport.bg/')
  ]);

  if(results[0].status==='fulfilled'){
    render('news',extractDarik(results[0].value),'DarikNews.bg');
  }else{
    document.getElementById('news').innerHTML='<div class="error">Новините временно не могат да се заредят.</div>';
  }

  if(results[1].status==='fulfilled'){
    render('sport',extractDsport(results[1].value),'dsport.bg');
  }else{
    document.getElementById('sport').innerHTML='<div class="error">dsport.bg временно не може да се зареди.</div>';
  }

  const now=new Date();
  status.textContent='Последна проверка: '+now.toLocaleTimeString('bg-BG')+' · следваща след 1 минута';
}

load();
setInterval(load,60000);
</script>
</body>
</html>
