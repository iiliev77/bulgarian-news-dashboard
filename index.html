<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🇧🇬 Български новини</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#07111f;color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{padding:30px 20px 50px}.wrap{max-width:1100px;margin:auto}
h1{font-size:52px;line-height:1.05;margin:15px 0 10px}
.sub{font-size:21px;color:#9fb0c7}.status{font-size:18px;color:#9fb0c7;margin:15px 0 20px}
button{background:#1a2a41;color:#fff;border:1px solid #466080;border-radius:14px;padding:14px 22px;font-size:20px}
.grid{display:grid;gap:22px;margin-top:30px}
.card{background:#101f32;border:2px solid #2d4666;border-radius:26px;overflow:hidden}
.card h2{margin:0;padding:22px 26px;background:#1b2d46;font-size:30px}
.items{padding:12px 24px}
.item{display:flex;gap:16px;align-items:flex-start;color:#f4f7fb;text-decoration:none;padding:16px 0;border-bottom:1px solid #2b405a}
.thumb{width:180px;height:105px;object-fit:cover;border-radius:12px;flex:none;background:#17283d}
.body{min-width:0}.body strong{display:block;font-size:21px;line-height:1.3}
.body span{display:block;color:#93a6bd;font-size:14px;margin-top:7px}
.loading{padding:25px;color:#a9bad0;font-size:19px}
.error{padding:25px;color:#ffb5b5;font-size:18px}
.small{color:#73869e;font-size:14px;margin-top:22px}
</style>
</head>
<body>
<div class="wrap">
<h1>🇧🇬 Български<br>новини</h1>
<div class="sub">DarikNews и Gong.bg • автоматично обновяване на всеки 5 минути</div>
<div id="status" class="status">Зареждане…</div>
<button onclick="loadAll()">↻ Обнови новините</button>
<div id="news" class="grid"></div>
<div class="small">Новините се показват от двата източника.</div>
</div>

<script>
const API="https://api.rss2json.com/v1/api.json?rss_url=";
const feeds=[
 {title:"📰 DarikNews — последни новини",rss:"https://dariknews.bg/rss.php"},
 {title:"⚽ Gong.bg — последни спортни новини",rss:"https://gong.bg/rss"}
];

function esc(s){
 return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function key(s){
 return String(s||"").toLowerCase().replace(/[^a-zа-я0-9]+/gi," ").trim();
}
async function getFeed(feed){
 const url=API+encodeURIComponent(feed.rss)+"&_="+Date.now();
 const r=await fetch(url,{cache:"no-store"});
 if(!r.ok) throw new Error("HTTP "+r.status);
 const d=await r.json();
 if(d.status!=="ok") throw new Error(d.message||"RSS error");
 return (d.items||[]).filter(x=>x.title&&x.link).slice(0,15);
}
async function loadAll(){
 const root=document.getElementById("news");
 const status=document.getElementById("status");
 root.innerHTML="";
 status.textContent="Зареждане на новините…";

 for(const feed of feeds){
  const card=document.createElement("section");
  card.className="card";
  card.innerHTML="<h2>"+esc(feed.title)+"</h2><div class='items'><div class='loading'>Зареждане…</div></div>";
  root.appendChild(card);
  try{
   const items=await getFeed(feed);
   // Dedupe only inside the same source; this avoids breaking valid articles
   // from the other source.
   const seen=new Set();
   const clean=items.filter(x=>{
    const k=key(x.title);
    if(seen.has(k)) return false;
    seen.add(k); return true;
   });
   const box=card.querySelector(".items");
   box.innerHTML=clean.map(x=>{
    const dt=x.pubDate?new Date(x.pubDate):null;
    const when=dt&&!isNaN(dt)?dt.toLocaleString("bg-BG",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"";
    const image=x.thumbnail||x.enclosure?.link||"";
    return "<a class='item' href='"+esc(x.link)+"' target='_blank' rel='noopener'>"+
      (image?"<img class='thumb' src='"+esc(image)+"' alt='' loading='lazy' onerror=\"this.style.display='none'\">":"")+
      "<div class='body'><strong>"+esc(x.title)+"</strong><span>"+esc(when)+"</span></div></a>";
   }).join("")||"<div class='loading'>Няма новини.</div>";
  }catch(e){
   card.querySelector(".items").innerHTML="<div class='error'>Временно не могат да се заредят новините. Натиснете „Обнови новините“.</div>";
  }
 }
 status.textContent="Последно обновяване: "+new Date().toLocaleTimeString("bg-BG");
}
loadAll();
setInterval(loadAll,300000);
</script>
</body>
</html>
