<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Български новини</title>
<meta http-equiv="refresh" content="300">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0f1115;color:#fff;font-family:Arial,sans-serif}
header{padding:18px 24px;background:#171a21;border-bottom:1px solid #30343d}
h1{margin:0;font-size:28px}
.updated{margin-top:6px;color:#aeb4bf;font-size:14px}
main{max-width:1200px;margin:auto;padding:18px}
section{margin-bottom:28px}
.title{font-size:22px;font-weight:700;margin:0 0 12px;padding-bottom:8px;border-bottom:2px solid #3d82f6}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.card{display:block;text-decoration:none;color:#fff;background:#191d24;border:1px solid #2c313b;border-radius:10px;padding:15px}
.card:hover{background:#20252e}
.source{font-size:12px;color:#8fa3bd;margin-bottom:7px}
.card h2{font-size:18px;line-height:1.3;margin:0 0 8px}
.date{font-size:12px;color:#8d949f}
.status{padding:25px;text-align:center;color:#aeb4bf;background:#191d24;border-radius:10px}
.error{color:#ff8a8a}
@media(max-width:600px){h1{font-size:22px}.title{font-size:19px}.card h2{font-size:16px}}
</style>
</head>
<body>
<header>
  <h1>🇧🇬 Български новини</h1>
  <div class="updated" id="updated">Зареждане...</div>
</header>

<main>
  <section>
    <h3 class="title">Последни новини — Darik</h3>
    <div id="news" class="grid"><div class="status">Зареждане...</div></div>
  </section>

  <section>
    <h3 class="title">Спорт — Dsport.bg</h3>
    <div id="sport" class="grid"><div class="status">Зареждане...</div></div>
  </section>
</main>

<script>
const NEWS_FILE = 'news.json';
const MAX = 12;

function arr(v){ return Array.isArray(v) ? v : []; }

function text(v){
  if(v == null) return '';
  if(typeof v === 'string') return v;
  return String(v);
}

function getTitle(x){
  return text(x.title || x.name || x.headline || '');
}
function getUrl(x){
  return text(x.link || x.url || x.guid || x.href || '#');
}
function getDate(x){
  return x.pubDate || x.published || x.date || x.created || x.isoDate || '';
}
function getSource(x){
  return text(x.source || x.site || x.publisher || x.feed || '');
}

function normalize(data){
  if(Array.isArray(data)) return data;
  if(data && Array.isArray(data.items)) return data.items;
  if(data && Array.isArray(data.articles)) return data.articles;
  if(data && Array.isArray(data.news)) return data.news;
  return [];
}

function isDarik(x){
  const s=(getSource(x)+' '+getUrl(x)).toLowerCase();
  return s.includes('darik');
}

function isDsport(x){
  const s=(getSource(x)+' '+getUrl(x)).toLowerCase();
  return s.includes('dsport') || s.includes('dsport.bg');
}

function isGong(x){
  const s=(getSource(x)+' '+getUrl(x)).toLowerCase();
  return s.includes('gong.bg') || s.includes('gong');
}

function render(id, items, emptyText){
  const el=document.getElementById(id);
  if(!items.length){
    el.innerHTML='<div class="status">'+emptyText+'</div>';
    return;
  }
  el.innerHTML=items.slice(0,MAX).map(x=>{
    const title=getTitle(x);
    const url=getUrl(x);
    const d=getDate(x);
    let ds='';
    if(d){
      const dt=new Date(d);
      ds=isNaN(dt)?text(d):dt.toLocaleString('bg-BG',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    }
    return `<a class="card" href="${url.replace(/"/g,'&quot;')}" target="_blank" rel="noopener">
      <div class="source">${id==='sport'?'DSPORT.BG':'DARIK'}</div>
      <h2>${title.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</h2>
      <div class="date">${ds}</div>
    </a>`;
  }).join('');
}

async function load(){
  try{
    const r=await fetch(NEWS_FILE+'?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('news.json не е намерен');
    const data=await r.json();
    const all=normalize(data);

    // ВАЖНО: Gong.bg се изключва изцяло.
    const darik=all.filter(isDarik);
    const dsport=all.filter(x=>isDsport(x) && !isGong(x));

    render('news',darik,'Няма заредени новини от Darik.');
    render('sport',dsport,'Няма заредени спортни новини от Dsport.bg.');

    document.getElementById('updated').textContent=
      'Последна проверка: '+new Date().toLocaleString('bg-BG')+
      ' • автоматично обновяване на всеки 5 минути';
  }catch(e){
    document.getElementById('news').innerHTML='<div class="status error">Грешка при зареждане на news.json.</div>';
    document.getElementById('sport').innerHTML='<div class="status error">Грешка при зареждане на news.json.</div>';
    document.getElementById('updated').textContent='Проверката не успя.';
  }
}
load();
setInterval(load,300000);
</script>
</body>
</html>
