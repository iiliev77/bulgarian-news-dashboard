<!doctype html>

<html lang="bg">

<head>

<meta charset="utf-8">

<meta name="viewport"

      content="width=device-width,initial-scale=1">

<title>BG News Dashboard</title>

<style>

/* =========================================

   ОСНОВНИ НАСТРОЙКИ

   ========================================= */

* {

  box-sizing: border-box;

}

html,

body {

  margin: 0;

  padding: 0;

  width: 100%;

  min-height: 100%;

}

body {

  background: #0b1220;

  color: #f7f9fc;

  font-family: Arial, Helvetica, sans-serif;

}

/* =========================================

   HEADER

   ========================================= */

header {

  height: 13vh;

  min-height: 105px;

  padding: 18px 30px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  background: #111a2e;

  border-bottom: 1px solid #26324a;

}

.logo {

  font-size: 32px;

  font-weight: 700;

  line-height: 1.2;

}

.clock {

  font-size: 34px;

  font-weight: 700;

  text-align: right;

}

.date {

  font-size: 18px;

  opacity: .75;

  margin-top: 3px;

  text-align: right;

}

/* =========================================

   MAIN

   ========================================= */

main {

  min-height: 87vh;

  padding: 22px 30px;

  display: grid;

  grid-template-columns: 1.35fr 1fr;

  gap: 24px;

}

.column {

  min-width: 0;

  overflow: hidden;

}

/* =========================================

   SECTION TITLE

   ========================================= */

.section-title {

  font-size: 22px;

  font-weight: 700;

  margin: 0 0 12px 0;

  color: #9fc5ff;

}

/* =========================================

   NEWS LIST

   ========================================= */

.news-list {

  display: flex;

  flex-direction: column;

  gap: 10px;

}

/* =========================================

   STORY

   ========================================= */

.story {

  display: block;

  text-decoration: none;

  color: #ffffff;

  background: #151f34;

  border: 1px solid #25314a;

  border-radius: 12px;

  padding: 13px 16px;

  transition:

    background .15s,

    transform .1s;

  cursor: pointer;

}

.story:hover {

  background: #22304a;

}

.story:active {

  background: #2d405f;

  transform: scale(.99);

}

.story-title {

  font-size: 20px;

  font-weight: 700;

  line-height: 1.25;

}

.story-meta {

  margin-top: 7px;

  font-size: 14px;

  opacity: .65;

}

/* =========================================

   LOADING / ERROR

   ========================================= */

.loading,

.empty,

.error {

  padding: 20px;

  background: #151f34;

  border-radius: 12px;

  opacity: .8;

  font-size: 18px;

}

.error {

  color: #ffb4b4;

}

/* =========================================

   FOOTER STATUS

   ========================================= */

.status {

  position: fixed;

  bottom: 8px;

  left: 50%;

  transform: translateX(-50%);

  font-size: 12px;

  opacity: .35;

  pointer-events: none;

}

/* =========================================

   MOBILE / ECHO SHOW

   ========================================= */

@media (max-width: 800px) {

  header {

    height: auto;

    min-height: 95px;

    padding: 14px 18px;

  }

  .logo {

    font-size: 23px;

  }

  .clock {

    font-size: 25px;

  }

  .date {

    font-size: 14px;

  }

  main {

    height: auto;

    min-height: 100vh;

    grid-template-columns: 1fr;

    padding: 15px 18px;

    gap: 20px;

  }

  .section-title {

    font-size: 22px;

  }

  .story {

    padding: 15px 16px;

    min-height: 70px;

  }

  .story-title {

    font-size: 18px;

  }

  .story-meta {

    font-size: 13px;

  }

}

/* =========================================

   МНОГО ГОЛЯМ ЕКРАН

   ========================================= */

@media (min-width: 1200px) {

  .story-title {

    font-size: 22px;

  }

  .section-title {

    font-size: 26px;

  }

}

</style>

</head>

<body>

<!-- =====================================

     HEADER

     ===================================== -->

<header>

  <div class="logo">

    🇧🇬 Български новини

  </div>

  <div>

    <div id="clock"

         class="clock">

      --:--

    </div>

    <div id="date"

         class="date">

      --

    </div>

  </div>

</header>

<!-- =====================================

     MAIN

     ===================================== -->

<main>

  <!-- ===================================

       НОВИНИ

       =================================== -->

  <section class="column">

    <div class="section-title">

      📰 Последни новини

    </div>

    <div id="news"

         class="news-list">

      <div class="loading">

        Зареждане на новините...

      </div>

    </div>

  </section>

  <!-- ===================================

       СПОРТ

       =================================== -->

  <section class="column">

    <div class="section-title">

      ⚽ Спорт

    </div>

    <div id="sports"

         class="news-list">

      <div class="loading">

        Зареждане на спортните новини...

      </div>

    </div>

  </section>

</main>

<div id="status"

     class="status">

</div>

<script>

/* =========================================

   RSS АДРЕСИ

   =========================================

   Използваме Google News RSS.

   Това е по-надеждно за статична GitHub

   Pages страница.

   ========================================= */

const NEWS_FEEDS = [

  "https://news.google.com/rss/search?q=България&hl=bg&gl=BG&ceid=BG:bg",

  "https://news.google.com/rss/search?q=Български+новини&hl=bg&gl=BG&ceid=BG:bg"

];

const SPORT_FEEDS = [

  "https://news.google.com/rss/search?q=спорт+България&hl=bg&gl=BG&ceid=BG:bg",

  "https://news.google.com/rss/search?q=футбол+България&hl=bg&gl=BG&ceid=BG:bg"

];

/* =========================================

   RSS PROXY

   =========================================

   Първо пробваме rss2json.

   Ако не работи -> allorigins.

   Така имаме резервен вариант.

   ========================================= */

async function fetchRSS(feed) {

  /* ---------------------------------------

     ВАРИАНТ 1

     RSS2JSON

     --------------------------------------- */

  try {

    const url =

      "https://api.rss2json.com/v1/api.json?rss_url="

      + encodeURIComponent(feed);

    const response =

      await fetch(url, {

        cache: "no-store"

      });

    if (response.ok) {

      const data =

        await response.json();

      if (

        data &&

        data.status === "ok" &&

        Array.isArray(data.items)

      ) {

        return data.items.map(item => ({

          title:

            item.title || "",

          link:

            item.link || "#",

          date:

            item.pubDate || "",

          source:

            getSource(item.title || "")

        }));

      }

    }

  } catch (error) {

    console.log(

      "RSS2JSON error:",

      error

    );

  }

  /* ---------------------------------------

     ВАРИАНТ 2

     ALLORIGINS

     --------------------------------------- */

  try {

    const proxy =

      "https://api.allorigins.win/raw?url="

      + encodeURIComponent(feed);

    const response =

      await fetch(proxy, {

        cache: "no-store"

      });

    if (!response.ok) {

      throw new Error(

        "Proxy error"

      );

    }

    const text =

      await response.text();

    return parseXML(

      text,

      feed

    );

  } catch (error) {

    console.log(

      "AllOrigins error:",

      error

    );

  }

  return [];

}

/* =========================================

   XML PARSER

   ========================================= */

function parseXML(text, feed) {

  try {

    const parser =

      new DOMParser();

    const xml =

      parser.parseFromString(

        text,

        "text/xml"

      );

    const items =

      [...xml.querySelectorAll("item")];

    return items.map(item => {

      const title =

        item.querySelector("title")

        ?.textContent

        ?.trim() || "";

      const link =

        item.querySelector("link")

        ?.textContent

        ?.trim() || "#";

      const date =

        item.querySelector("pubDate")

        ?.textContent

        ?.trim() || "";

      return {

        title,

        link,

        date,

        source:

          getSource(title)

      };

    });

  } catch (error) {

    console.log(

      "XML parser error:",

      error

    );

    return [];

  }

}

/* =========================================

   ОПИТВАМЕ СЕ ДА ОПРЕДЕЛИМ ИЗТОЧНИКА

   ========================================= */

function getSource(title) {

  const text =

    title.toLowerCase();

  if (text.includes("darik")) {

    return "Darik";

  }

  if (text.includes("gong")) {

    return "Gong";

  }

  if (text.includes("sportal")) {

    return "Sportal";

  }

  if (text.includes("blitz")) {

    return "Blitz";

  }

  if (text.includes("actualno")) {

    return "Actualno";

  }

  return "Google News";

}

/* =========================================

   ESCAPE HTML

   ========================================= */

function escapeHtml(text) {

  return String(text || "")

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}

/* =========================================

   FORMAT DATE

   ========================================= */

function formatDate(value) {

  if (!value) {

    return "";

  }

  const d =

    new Date(value);

  if (

    isNaN(

      d.getTime()

    )

  ) {

    return "";

  }

  return d.toLocaleString(

    "bg-BG",

    {

      day: "2-digit",

      month: "2-digit",

      hour: "2-digit",

      minute: "2-digit"

    }

  );

}

/* =========================================

   LOAD ONE FEED

   ========================================= */

async function loadFeed(feed) {

  return await fetchRSS(feed);

}

/* =========================================

   LOAD MULTIPLE FEEDS

   ========================================= */

async function loadFeeds(feeds) {

  const results =

    await Promise.all(

      feeds.map(

        feed => loadFeed(feed)

      )

    );

  let all = [];

  results.forEach(

    items => {

      all =

        all.concat(items);

    }

  );

  return all;

}

/* =========================================

   REMOVE DUPLICATES

   ========================================= */

function removeDuplicates(items) {

  const seen =

    new Set();

  return items.filter(

    item => {

      const key =

        item.title

          .trim()

          .toLowerCase();

      if (!key) {

        return false;

      }

      if (seen.has(key)) {

        return false;

      }

      seen.add(key);

      return true;

    }

  );

}

/* =========================================

   SORT NEWS

   ========================================= */

function sortNews(items) {

  return items.sort(

    (a, b) => {

      const da =

        new Date(

          a.date

        ).getTime() || 0;

      const db =

        new Date(

          b.date

        ).getTime() || 0;

      return db - da;

    }

  );

}

/* =========================================

   CREATE STORY

   ========================================= */

function story(item) {

  const title =

    escapeHtml(

      item.title

    );

  const source =

    escapeHtml(

      item.source

    );

  const date =

    formatDate(

      item.date

    );

  let link =

    item.link || "#";

  /*

     Ако няма линк,

     не правим счупен бутон.

  */

  if (!link) {

    link = "#";

  }

  return `

    <a

      class="story"

      href="${link}"

      target="_blank"

      rel="noopener noreferrer"

    >

      <div class="story-title">

        ${title}

      </div>

      <div class="story-meta">

        ${source}

        ${date

          ? " • " + date

          : ""}

      </div>

    </a>

  `;

}

/* =========================================

   RENDER

   ========================================= */

function render(

  items,

  elementId,

  errorText

) {

  const element =

    document.getElementById(

      elementId

    );

  if (!items.length) {

    element.innerHTML = `

      <div class="error">

        ${errorText}

      </div>

    `;

    return;

  }

  const limited =

    items.slice(0, 10);

  element.innerHTML =

    limited

      .map(story)

      .join("");

}

/* =========================================

   LOAD ALL NEWS

   ========================================= */

async function loadNews() {

  const newsElement =

    document.getElementById(

      "news"

    );

  const sportsElement =

    document.getElementById(

      "sports"

    );

  newsElement.innerHTML = `

    <div class="loading">

      Зареждане на новините...

    </div>

  `;

  sportsElement.innerHTML = `

    <div class="loading">

      Зареждане на спортните новини...

    </div>

  `;

  try {

    /* -------------------------------------

       НОВИНИ И СПОРТ ЕДНОВРЕМЕННО

       ------------------------------------- */

    const [

      news,

      sports

    ] = await Promise.all([

      loadFeeds(

        NEWS_FEEDS

      ),

      loadFeeds(

        SPORT_FEEDS

      )

    ]);

    /* -------------------------------------

       ОБРАБОТКА

       ------------------------------------- */

    const cleanNews =

      removeDuplicates(

        sortNews(news)

      );

    const cleanSports =

      removeDuplicates(

        sortNews(sports)

      );

    /* -------------------------------------

       ПОКАЗВАНЕ

       ------------------------------------- */

    render(

      cleanNews,

      "news",

      "Новините временно не могат да бъдат заредени."

    );

    render(

      cleanSports,

      "sports",

      "Спортните новини временно не могат да бъдат заредени."

    );

    /* -------------------------------------

       STATUS

       ------------------------------------- */

    document.getElementById(

      "status"

    ).textContent =

      "Обновено: " +

      new Date()

        .toLocaleTimeString(

          "bg-BG",

          {

            hour: "2-digit",

            minute: "2-digit"

          }

        );

  } catch (error) {

    console.log(

      "Dashboard error:",

      error

    );

    newsElement.innerHTML = `

      <div class="error">

        Грешка при зареждане на новините.

      </div>

    `;

    sportsElement.innerHTML = `

      <div class="error">

        Грешка при зареждане на спорта.

      </div>

    `;

  }

}

/* =========================================

   CLOCK

   ========================================= */

function tick() {

  const now =

    new Date();

  document.getElementById(

    "clock"

  ).textContent =

    now.toLocaleTimeString(

      "bg-BG",

      {

        hour: "2-digit",

        minute: "2-digit"

      }

    );

  document.getElementById(

    "date"

  ).textContent =

    now.toLocaleDateString(

      "bg-BG",

      {

        weekday: "long",

        day: "numeric",

        month: "long"

      }

    );

}

/* =========================================

   START

   ========================================= */

tick();

setInterval(

  tick,

  1000

);

/* Зареждаме новините */

loadNews();

/* =========================================

   АВТОМАТИЧНО ОБНОВЯВАНЕ

   НА 5 МИНУТИ

   ========================================= */

setInterval(

  loadNews,

  300000

);

</script>

</body>

</html>
