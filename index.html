<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>Български новини — Darik & Gong</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#07101d;color:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.header{position:sticky;top:0;z-index:10;background:#0b1727;border-bottom:1px solid #26384d;padding:18px 24px}
.top{display:flex;justify-content:space-between;align-items:center;gap:20px}
h1{margin:0;font-size:29px;font-weight:800}.clock{font-size:25px;font-weight:700}
.status{margin-top:7px;color:#9eacbd;font-size:14px}
.wrap{max-width:1500px;margin:auto;padding:16px 24px 40px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.section{background:#0a1626;border:1px solid #26384d;border-radius:14px;padding:14px}
.section h2{font-size:20px;margin:2px 4px 12px}
.card{display:block;background:#0e1b2c;border:1px solid #26384d;border-radius:11px;padding:13px;margin-bottom:9px;color:inherit;text-decoration:none}
.card:last-child{margin-bottom:0}.card:hover{background:#132238}
.title{font-size:18px;line-height:1.3;font-weight:700}
.meta{color:#93a5b9;font-size:12px;margin-top:7px}
.empty{padding:35px;text-align:center;color:#9eacbd;background:#0e1b2c;border-radius:12px}
@media(max-width:850px){.grid{grid-template-columns:1fr}h1{font-size:24px}}
</style>
</head>
<body>
<header class="header">
  <div class="top">
    <h1>🇧🇬 Последни новини</h1>
    <div id="clock" class="clock">--:--</div>
  </div>
  <div id="status" class="status">Зареждане…</div>
</header>

<main class="wrap">
  <div class="grid">
    <section class="section">
      <h2>📰 DarikNews</h2>
      <div id="darik"><div class="empty">Зареждане…</div></div>
    </section>
    <section class="section">
      <h2>⚽ Gong.bg</h2>
      <div id="gong"><div class="empty">Зареждане…</div></div>
    </section>
  </div>
</main>

<script>
const SOURCES=[
 {id:"darik",name:"DarikNews",url:"https://dariknews.bg/novini"},
 {id:"gong",name:"Gong.bg",url:"https://gong.bg/"}
];

function esc(s){
 return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function absolute(url,base){
 try{return new URL(url,base).href}catch(e){return ""}
}

/* Взема HTML през няколко независими CORS шлюза.
   Това избягва проблема, при който GitHub Pages не може
   директно да прочете сайта заради CORS. */
async function getPage(url){
 const targets=[
   "https://api.allorigins.win/raw?url="+encodeURIComponent(url)+"&t="+Date.now(),
   "https://r.jina.ai/"+url,
   "https://api.codetabs.com/v1/proxy?quest="+encodeURIComponent(url)
 ];
 for(const target of targets){
   try{
     const r=await fetch(target,{cache:"no-store"});
     if(!r.ok) continue;
     const t=await r.text();
     if(t && t.length>1000) return t;
   }catch(e){}
 }
 throw new Error("Не може да се зареди "+url);
}

function parseHTML(html,sourceUrl){
 const doc=new DOMParser().parseFromString(html,"text/html");
 const result=[];
 const seen=new Set();

 /* Първо използваме реалните заглавия на страницата. */
 const selectors=[
   "article h1 a","article h2 a","article h3 a",
   "h1 a","h2 a","h3 a"
 ];

 for(const selector of selectors){
   for(const a of doc.querySelectorAll(selector)){
     const title=(a.textContent||"").replace(/\s+/g," ").trim();
     const href=absolute(a.getAttribute("href")||"",sourceUrl);
     if(!title || title.length<12 || !href) continue;
     if(!href.startsWith("https://dariknews.bg/") &&
        !href.startsWith("https://gong.bg/")) continue;

     const key=title.toLowerCase();
     if(seen.has(key)) continue;
     seen.add(key);
     result.push({title,href});
     if(result.length>=30) return result;
   }
 }

 /* Резервен вариант за Jina/нестандартна HTML структура. */
 if(result.length<5){
   for(const a of doc.querySelectorAll("a")){
     const title=(a.textContent||"").replace(/\s+/g," ").trim();
     const href=absolute(a.getAttribute("href")||"",sourceUrl);
     if(!title || title.length<25 || !href) continue;
     if(!href.startsWith("https://dariknews.bg/") &&
        !href.startsWith("https://gong.bg/")) continue;
     const key=title.toLowerCase();
     if(seen.has(key)) continue;
     seen.add(key);
     result.push({title,href});
     if(result.length>=30) break;
   }
 }
 return result;
}

async function loadSource(s){
 const box=document.getElementById(s.id);
 try{
   const html=await getPage(s.url);
   const news=parseHTML(html,s.url);
   if(!news.length) throw new Error("няма новини");

   /* Страниците на самите сайтове са подредени от най-новите.
      Не пренареждаме заглавията, за да запазим тяхната актуална последователност. */
   box.innerHTML=news.slice(0,20).map((n,i)=>`
     <a class="card" href="${esc(n.href)}" target="_blank" rel="noopener">
       <div class="title">${esc(n.title)}</div>
       <div class="meta">${esc(s.name)} · последни публикации</div>
     </a>
   `).join("");
   return true;
 }catch(e){
   box.innerHTML='<div class="empty">Източникът временно не може да бъде зареден.</div>';
   return false;
 }
}

async function load(){
 document.getElementById("status").textContent="Обновяване на последните новини…";
 const results=await Promise.all(SOURCES.map(loadSource));
 const ok=results.filter(Boolean).length;
 document.getElementById("status").textContent=
   ok+" от 2 източника · последно обновяване "+
   new Date().toLocaleTimeString("bg-BG",{hour:"2-digit",minute:"2-digit"});
}

function clock(){
 document.getElementById("clock").textContent=
   new Date().toLocaleTimeString("bg-BG",{hour:"2-digit",minute:"2-digit"});
}
clock();setInterval(clock,1000);
load();
setInterval(load,5*60*1000);
</script>
</body>
</html>
