<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07101d">
<title>BG News Dashboard</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#07101d;color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{min-height:100vh}
.header{position:sticky;top:0;z-index:5;background:#0b1727;border-bottom:1px solid #26364a;padding:18px 24px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px}
.title{font-size:30px;font-weight:800;letter-spacing:.2px}
.clock{font-size:25px;font-weight:700;white-space:nowrap}
.status{margin-top:8px;color:#9eacbd;font-size:14px}
.wrap{max-width:1500px;margin:0 auto;padding:16px 24px 40px}
.sourcebar{display:flex;gap:8px;overflow:auto;padding-bottom:14px}
.sourcebar button{border:1px solid #314258;background:#102035;color:#dce6f2;border-radius:999px;padding:9px 14px;font-size:15px;white-space:nowrap}
.sourcebar button.active{background:#dce6f2;color:#08111d;border-color:#dce6f2}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{display:block;background:#0e1b2c;border:1px solid #26384d;border-radius:14px;padding:16px;text-decoration:none;color:inherit;min-height:108px}
.card:hover{background:#132238}
.meta{display:flex;justify-content:space-between;gap:12px;color:#8fa1b5;font-size:13px;margin-bottom:8px}
.source{font-weight:700;color:#aebfd1}
.time{white-space:nowrap}
.headline{font-size:20px;line-height:1.3;font-weight:700}
.empty{padding:40px;text-align:center;color:#9eacbd;background:#0e1b2c;border-radius:14px}
@media(max-width:800px){.grid{grid-template-columns:1fr}.title{font-size:24px}.headline{font-size:18px}}
</style>
</head>
<body>
<header class="header">
  <div class="top">
    <div class="title">🇧🇬 Български новини</div>
    <div id="clock" class="clock">--:--</div>
  </div>
  <div id="status" class="status">Зареждане на последните новини…</div>
</header>

<main class="wrap">
  <div class="sourcebar">
    <button class="active" data-filter="all">Всички</button>
    <button data-filter="DarikNews">DarikNews</button>
    <button data-filter="БЛИЦ">БЛИЦ</button>
    <button data-filter="Vesti.bg">Vesti.bg</button>
    <button data-filter="Sportal.bg">Sportal.bg</button>
  </div>
  <section id="news" class="grid">
    <div class="empty">Зареждане…</div>
  </section>
</main>

<script>
const FEEDS = [
  {
    name:"DarikNews",
    url:"https://news.google.com/rss/search?q=site%3Adariknews.bg&hl=bg&gl=BG&ceid=BG%3Abg"
  },
  {
    name:"БЛИЦ",
    url:"https://news.google.com/rss/search?q=site%3Ablitz.bg&hl=bg&gl=BG&ceid=BG%3Abg"
  },
  {
    name:"Vesti.bg",
    url:"https://news.google.com/rss/search?q=site%3Avesti.bg&hl=bg&gl=BG&ceid=BG%3Abg"
  },
  {
    name:"Sportal.bg",
    url:"https://news.google.com/rss/search?q=site%3Asportal.bg&hl=bg&gl=BG&ceid=BG%3Abg"
  }
];

const state={items:[],filter:"all"};

function escapeHtml(s){
  return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

function cleanTitle(s){
  return String(s||"")
    .replace(/<!\[CDATA\[|\]\]>/g,"")
    .replace(/\s+/g," ")
    .trim();
}

function stripHtml(s){
  const d=document.createElement("div");
  d.innerHTML=s||"";
  return d.textContent||d.innerText||"";
}

async function fetchText(url){
  const proxies=[
    "https://api.allorigins.win/raw?url="+encodeURIComponent(url),
    "https://api.codetabs.com/v1/proxy?quest="+encodeURIComponent(url)
  ];
  let last;
  for(const p of proxies){
    try{
      const r=await fetch(p,{cache:"no-store"});
      if(!r.ok) throw new Error("HTTP "+r.status);
      const t=await r.text();
      if(t && (t.includes("<item") || t.includes("<entry"))) return t;
    }catch(e){last=e}
  }
  throw last||new Error("Feed unavailable");
}

function parseFeed(xml,source){
  const doc=new DOMParser().parseFromString(xml,"text/xml");
  const nodes=[...doc.querySelectorAll("item, entry")];
  return nodes.map(n=>{
    const title=cleanTitle(n.querySelector("title")?.textContent);
    let link="";
    const linkEl=n.querySelector("link");
    if(linkEl){
      link=linkEl.getAttribute("href")||linkEl.textContent||"";
    }
    const desc=stripHtml(
      n.querySelector("description, summary, content\\:encoded")?.textContent||""
    );
    const dateText=n.querySelector("pubDate, published, updated")?.textContent||"";
    const date=new Date(dateText);
    return {
      title,link:link.trim(),desc,source,
      date:isNaN(date.getTime())?new Date():date
    };
  }).filter(x=>x.title && x.link);
}

function render(){
  const box=document.getElementById("news");
  let list=state.items;
  if(state.filter!=="all") list=list.filter(x=>x.source===state.filter);
  if(!list.length){
    box.innerHTML='<div class="empty">Няма заредени новини. Натиснете обновяване на страницата.</div>';
    return;
  }
  box.innerHTML=list.map(x=>{
    const dt=x.date.toLocaleTimeString("bg-BG",{hour:"2-digit",minute:"2-digit"});
    return `<a class="card" href="${escapeHtml(x.link)}" target="_blank" rel="noopener">
      <div class="meta"><span class="source">${escapeHtml(x.source)}</span><span class="time">${dt}</span></div>
      <div class="headline">${escapeHtml(x.title)}</div>
    </a>`;
  }).join("");
}

async function load(){
  const status=document.getElementById("status");
  status.textContent="Зареждане на последните новини…";
  const results=await Promise.allSettled(FEEDS.map(async f=>{
    const xml=await fetchText(f.url);
    return parseFeed(xml,f.name);
  }));
  const all=[];
  results.forEach(r=>{if(r.status==="fulfilled") all.push(...r.value)});
  const seen=new Set();
  state.items=all
    .sort((a,b)=>b.date-a.date)
    .filter(x=>{
      const k=x.link||x.title;
      if(seen.has(k)) return false;
      seen.add(k); return true;
    })
    .slice(0,80);
  render();
  const ok=new Set(state.items.map(x=>x.source));
  status.textContent=state.items.length
    ? `Последно обновяване: ${new Date().toLocaleTimeString("bg-BG",{hour:"2-digit",minute:"2-digit"})} · ${state.items.length} новини`
    : "Неуспешно зареждане на RSS източниците.";
}

function tick(){
  document.getElementById("clock").textContent=
    new Date().toLocaleTimeString("bg-BG",{hour:"2-digit",minute:"2-digit"});
}
tick(); setInterval(tick,1000);

document.querySelectorAll(".sourcebar button").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".sourcebar button").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    state.filter=btn.dataset.filter;
    render();
  });
});

load();
setInterval(load,5*60*1000);
</script>
</body>
</html>
