<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="3600">
<title>🇧🇬 Български новини</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#06101d;color:#eef4ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{padding:34px 18px 60px}
.wrap{max-width:980px;margin:auto}
h1{font-size:36px;margin:0 0 8px;font-weight:800}
.sub{color:#8fa5c2;font-size:17px;margin-bottom:28px}
h2{font-size:30px;margin:24px 0 12px}
.box{border:2px solid #29466d;border-radius:30px;padding:22px 22px 18px;margin-bottom:26px;background:rgba(7,16,29,.72)}
.source{color:#8fa5c2;font-size:17px;margin-bottom:10px}
.status{color:#ffaaa8;font-size:18px}
.item{display:block;text-decoration:none;color:#f4f7ff;border-top:1px solid #203553;padding:14px 2px 12px}
.item:first-child{border-top:0}
.title{font-size:20px;line-height:1.3;font-weight:700}
.time{color:#7890ae;font-size:14px;margin-top:5px}
.footer{color:#8fa5c2;font-size:16px;line-height:1.5;margin-top:12px}
.ok{color:#9fc5ff}
@media(max-width:600px){
 body{padding:22px 12px 40px} h1{font-size:30px} h2{font-size:26px}
 .box{border-radius:22px;padding:18px}
 .title{font-size:18px}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>🇧🇬 Български новини</h1>
  <div class="sub">Последни публикации • автоматично обновяване на всяка 1 минута</div>

  <h2>📰 Новини</h2>
  <div class="box">
    <div class="source">DarikNews.bg</div>
    <div id="darik" class="status">Зареждам последните новини…</div>
  </div>

  <h2>⚽ Спорт</h2>
  <div class="box">
    <div class="source">Gong.bg</div>
    <div id="gong" class="status">Зареждам последните спортни новини…</div>
  </div>

  <div class="footer">
    Автоматично обновяване: всяка 1 минута • Без снимки<br>
    Заглавията и връзките водят към оригиналните публикации.
  </div>
</div>

<script>
const FEEDS = {
  darik: "https://dariknews.bg/rss.php",
  gong: "https://gong.bg/rss"
};

function cleanText(s){
  const d=document.createElement("div");
  d.innerHTML=s||"";
  return (d.textContent||d.innerText||"").replace(/\s+/g," ").trim();
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function render(el, items){
  if(!items.length){
    el.innerHTML='<div class="status">Няма налични новини в момента.</div>';
    return;
  }
  el.innerHTML=items.slice(0,10).map(x=>{
    const title=cleanText(x.title)||"Без заглавие";
    const link=x.link||"#";
    let date="";
    if(x.pubDate){
      const d=new Date(x.pubDate);
      if(!isNaN(d)) date=d.toLocaleString("bg-BG",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
    }
    return `<a class="item" href="${escapeHtml(link)}" target="_blank" rel="noopener noreferrer">
      <div class="title">${escapeHtml(title)}</div>
      ${date?`<div class="time">${date}</div>`:""}
    </a>`;
  }).join("");
}

async function rss2json(url){
  const endpoint="https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(url)+"&_="+Date.now();
  const r=await fetch(endpoint,{cache:"no-store"});
  if(!r.ok) throw new Error("rss2json HTTP "+r.status);
  const j=await r.json();
  if(j.status && j.status!=="ok") throw new Error(j.message||"RSS2JSON error");
  return j.items||[];
}

async function allOrigins(url){
  const endpoint="https://api.allorigins.win/raw?url="+encodeURIComponent(url)+"&_="+Date.now();
  const r=await fetch(endpoint,{cache:"no-store"});
  if(!r.ok) throw new Error("proxy HTTP "+r.status);
  const xml=await r.text();
  const doc=new DOMParser().parseFromString(xml,"text/xml");
  if(doc.querySelector("parsererror")) throw new Error("invalid XML");
  return [...doc.querySelectorAll("item")].map(item=>({
    title:item.querySelector("title")?.textContent||"",
    link:item.querySelector("link")?.textContent||"",
    pubDate:item.querySelector("pubDate")?.textContent||""
  }));
}

async function loadOne(id){
  const el=document.getElementById(id);
  const url=FEEDS[id];
  try{
    let items=[];
    try{ items=await rss2json(url); }
    catch(e){ items=await allOrigins(url); }
    render(el,items);
  }catch(e){
    console.error(id,e);
    el.innerHTML='<div class="status">Новините временно не могат да бъдат заредени. Ще опитам отново автоматично.</div>';
  }
}

async function loadAll(){
  await Promise.all([loadOne("darik"),loadOne("gong")]);
}
loadAll();
setInterval(loadAll,60000);
</script>
</body>
</html>
