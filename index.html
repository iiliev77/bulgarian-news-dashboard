<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07101d">
<title>🇧🇬 Български новини</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#07101d;color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{padding:24px 18px 36px}
.wrap{max-width:900px;margin:auto}
h1{font-size:34px;margin:4px 0 8px;font-weight:800}
.status{font-size:16px;color:#94a6c2;margin-bottom:22px}
.section{margin:24px 0 34px}
.section-title{font-size:29px;font-weight:800;margin:0 0 12px}
.card{border:2px solid #304362;border-radius:30px;padding:22px 22px 10px;margin:0 0 18px;background:#07101d}
.source{font-size:16px;color:#91a3c0;margin-bottom:10px}
.item{padding:16px 0;border-bottom:1px solid #263751}
.item:last-child{border-bottom:0}
.item a{color:#f5f7fb;text-decoration:none;font-size:23px;line-height:1.28;font-weight:700;display:block}
.time{font-size:14px;color:#8ea0bb;margin-top:8px}
.error{color:#ffb1b1;font-size:18px;line-height:1.45;padding:12px 0}
.footer{color:#8ea0bb;font-size:16px;line-height:1.5;margin-top:10px}
.small{font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🇧🇬 Български новини</h1>
  <div id="status" class="status">Зареждане на последните новини…</div>

  <section class="section">
    <div class="section-title">📰 Новини</div>
    <div class="card">
      <div class="source">DarikNews.bg</div>
      <div id="news"></div>
    </div>
  </section>

  <section class="section">
    <div class="section-title">⚽ Спорт</div>
    <div class="card">
      <div class="source">Gong.bg</div>
      <div id="sport"></div>
    </div>
  </section>

  <div class="footer">
    Автоматично обновяване: всяка 1 минута • Без снимки<br>
    <span class="small">Заглавията водят към оригиналните публикации.</span>
  </div>
</div>

<script>
const FEEDS = {
  news: {
    name: "DarikNews.bg",
    url: "https://dariknews.bg/rss.php",
    cache: "bgnews_darik_v2"
  },
  sport: {
    name: "Gong.bg",
    url: "https://gong.bg/rss",
    cache: "bgnews_gong_v2"
  }
};

const PROXIES = [
  feed => "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(feed) + "&count=12",
  feed => "https://api.allorigins.win/raw?url=" + encodeURIComponent(feed),
  feed => "https://corsproxy.io/?url=" + encodeURIComponent(feed)
];

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function cleanTitle(s){
  const d=document.createElement("div");
  d.innerHTML=s || "";
  return (d.textContent || d.innerText || "").trim();
}

function dateText(v){
  if(!v) return "";
  const d=new Date(v);
  if(Number.isNaN(d.getTime())) return "";
  return d.toLocaleString("bg-BG",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
}

function normalize(items){
  return (items||[]).map(x => ({
    title: cleanTitle(x.title || ""),
    link: x.link || x.guid || "#",
    date: x.pubDate || x.published || x.isoDate || ""
  })).filter(x => x.title && x.link).slice(0,12);
}

async function fetchFeed(feedUrl){
  let lastErr;
  for(const makeUrl of PROXIES){
    try{
      const controller=new AbortController();
      const timer=setTimeout(()=>controller.abort(),9000);
      const r=await fetch(makeUrl(feedUrl)+"&cb="+Date.now(),{
        cache:"no-store",
        signal:controller.signal
      });
      clearTimeout(timer);
      if(!r.ok) throw new Error("HTTP "+r.status);
      const text=await r.text();

      // rss2json returns JSON
      if(text.trim().startsWith("{")){
        const j=JSON.parse(text);
        const items=normalize(j.items);
        if(items.length) return items;
      }

      // Direct XML/proxy fallback
      const xml=new DOMParser().parseFromString(text,"text/xml");
      const nodes=[...xml.querySelectorAll("item")];
      const items=nodes.map(n=>({
        title:n.querySelector("title")?.textContent || "",
        link:n.querySelector("link")?.textContent || "",
        date:n.querySelector("pubDate")?.textContent || ""
      }));
      const out=normalize(items);
      if(out.length) return out;
      throw new Error("Празен RSS");
    }catch(e){ lastErr=e; }
  }
  throw lastErr || new Error("Неуспешно зареждане");
}

function render(id,items){
  const el=document.getElementById(id);
  if(!items.length){
    el.innerHTML='<div class="error">Няма налични новини в момента.</div>';
    return;
  }
  el.innerHTML=items.map(x=>`
    <div class="item">
      <a href="${esc(x.link)}" target="_blank" rel="noopener">${esc(x.title)}</a>
      ${x.date ? `<div class="time">${esc(dateText(x.date))}</div>` : ""}
    </div>`).join("");
}

function loadCache(feed,id){
  try{
    const x=JSON.parse(localStorage.getItem(feed.cache)||"null");
    if(Array.isArray(x)&&x.length) render(id,x);
  }catch(e){}
}

async function loadOne(key,id){
  const feed=FEEDS[key];
  loadCache(feed,id);
  try{
    const items=await fetchFeed(feed.url);
    localStorage.setItem(feed.cache,JSON.stringify(items));
    render(id,items);
    return true;
  }catch(e){
    // Keep cached content if available; only show error if there is no cache.
    const cached=localStorage.getItem(feed.cache);
    if(!cached) render(id,[]);
    return false;
  }
}

async function refresh(){
  document.getElementById("status").textContent="Обновяване…";
  const results=await Promise.all([
    loadOne("news","news"),
    loadOne("sport","sport")
  ]);
  const ok=results.filter(Boolean).length;
  const now=new Date().toLocaleTimeString("bg-BG",{hour:"2-digit",minute:"2-digit"});
  document.getElementById("status").textContent =
    ok===2 ? `Последно обновяване: ${now}` :
    ok===1 ? `Последно обновяване: ${now} • единият източник временно не отговаря` :
             `Няма връзка с източниците • показвам последните налични данни`;
}

refresh();
setInterval(refresh,60000);
</script>
</body>
</html>
