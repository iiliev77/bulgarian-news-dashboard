<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🇧🇬 Български новини</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#07111f;color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{padding:30px 20px 50px}.wrap{max-width:1100px;margin:auto}
h1{font-size:52px;line-height:1.05;margin:12px 0}.sub{font-size:21px;color:#9fb0c7}
.status{font-size:18px;color:#9fb0c7;margin:15px 0 20px}
button{background:#1a2a41;color:#fff;border:1px solid #466080;border-radius:14px;padding:14px 22px;font-size:20px}
.card{margin-top:28px;background:#101f32;border:2px solid #2d4666;border-radius:26px;overflow:hidden}
.card h2{margin:0;padding:22px 26px;background:#1b2d46;font-size:30px}
.items{padding:10px 24px}.item{display:flex;gap:16px;color:#f4f7fb;text-decoration:none;padding:17px 0;border-bottom:1px solid #2b405a}
.thumb{width:180px;height:105px;object-fit:cover;border-radius:12px;flex:none}
.body strong{display:block;font-size:21px;line-height:1.3}.body span{display:block;color:#93a6bd;font-size:14px;margin-top:7px}
.loading{padding:25px;color:#a9bad0}.error{padding:25px;color:#ffb5b5}
.small{color:#73869e;font-size:14px;margin-top:22px}
</style>
</head>
<body>
<div class="wrap">
<h1>🇧🇬 Български<br>новини</h1>
<div class="sub">DarikNews — последни новини</div>
<div id="status" class="status">Зареждане…</div>
<button onclick="loadNews()">↻ Обнови новините</button>
<section class="card">
<h2>📰 DarikNews — Последни новини</h2>
<div id="items" class="items"><div class="loading">Зареждане…</div></div>
</section>
<div class="small">Автоматично обновяване на всеки 5 минути.</div>
</div>

<script>
const RSS="https://dariknews.bg/rss.php";
const API="https://api.rss2json.com/v1/api.json?rss_url=";

function esc(s){
 return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

async function loadNews(){
 const box=document.getElementById("items");
 const status=document.getElementById("status");
 status.textContent="Зареждане на последните новини…";

 try{
   const url=API+encodeURIComponent(RSS)+"&_="+Date.now();
   const response=await fetch(url,{cache:"no-store"});
   if(!response.ok) throw new Error("HTTP "+response.status);

   const data=await response.json();
   if(data.status!=="ok") throw new Error("RSS error");

   const seen=new Set();
   const items=(data.items||[]).filter(x=>{
     const k=String(x.title||"").toLowerCase().replace(/[^a-zа-я0-9]+/gi," ").trim();
     if(!k||seen.has(k)) return false;
     seen.add(k); return true;
   }).slice(0,15);

   if(!items.length){
     box.innerHTML='<div class="error">Няма намерени новини.</div>';
   }else{
     box.innerHTML=items.map(x=>{
       const image=x.thumbnail || (x.enclosure && x.enclosure.link) || "";
       const date=x.pubDate ? new Date(x.pubDate) : null;
       const when=date && !isNaN(date) ? date.toLocaleString("bg-BG",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}) : "";
       return `<a class="item" href="${esc(x.link)}" target="_blank" rel="noopener">
         ${image?`<img class="thumb" src="${esc(image)}" alt="" loading="lazy" onerror="this.style.display='none'">`:''}
         <div class="body"><strong>${esc(x.title)}</strong><span>${esc(when)}</span></div>
       </a>`;
     }).join("");
   }

   status.textContent="Последно обновяване: "+new Date().toLocaleTimeString("bg-BG");
 }catch(e){
   box.innerHTML='<div class="error">Новините временно не могат да бъдат заредени.</div>';
   status.textContent="Грешка при зареждането";
 }
}

loadNews();
setInterval(loadNews,300000);
</script>
</body>
</html>
