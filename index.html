<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🇧🇬 Български новини</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#07111f;color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{padding:28px 20px 50px}.wrap{max-width:1100px;margin:auto}h1{font-size:52px;line-height:1.05;margin:12px 0}.sub{font-size:21px;color:#9fb0c7}.status{font-size:18px;color:#9fb0c7;margin:15px 0 20px}
button{background:#1a2a41;color:#fff;border:1px solid #466080;border-radius:14px;padding:14px 22px;font-size:20px}.grid{display:grid;gap:22px;margin-top:28px}
.card{background:#101f32;border:2px solid #2d4666;border-radius:26px;overflow:hidden}.card h2{margin:0;padding:22px 26px;background:#1b2d46;font-size:30px}.items{padding:10px 24px}
.item{display:flex;gap:16px;align-items:flex-start;color:#f4f7fb;text-decoration:none;padding:16px 0;border-bottom:1px solid #2b405a}.thumb{width:180px;height:105px;object-fit:cover;border-radius:12px;flex:none;background:#17283d}.body{min-width:0}.body strong{display:block;font-size:21px;line-height:1.3}.body span{display:block;color:#93a6bd;font-size:14px;margin-top:7px}
.loading{padding:25px;color:#a9bad0}.error{padding:25px;color:#ffb5b5}.small{color:#73869e;font-size:14px;margin-top:22px}
</style>
</head>
<body>
<div class="wrap">
<h1>🇧🇬 Български<br>новини</h1>
<div class="sub">Последни новини директно от страниците на DarikNews и Gong.bg</div>
<div id="status" class="status">Зареждане…</div>
<button onclick="loadAll()">↻ Обнови новините</button>
<div id="news" class="grid"></div>
<div class="small">Автоматично обновяване на всеки 5 минути.</div>
</div>

<script>
const SOURCES=[
 {title:"📰 DarikNews — Последни новини",url:"https://dariknews.bg/novini"},
 {title:"⚽ Gong.bg — Последни",url:"https://gong.bg/"}
];

function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function norm(s){return String(s||"").toLowerCase().replace(/[^a-zа-я0-9]+/gi," ").trim();}

async function readPage(url){
 const target=url.replace(/^https?:\/\//,"");
 const r=await fetch("https://r.jina.ai/http://"+target+"?v="+Date.now(),{cache:"no-store"});
 if(!r.ok)throw new Error("HTTP "+r.status);
 return await r.text();
}

function extract(md,source){
 const lines=md.split(/\r?\n/);
 const result=[];const seen=new Set();

 for(let i=0;i<lines.length && result.length<15;i++){
   // Both sites expose article titles as markdown links.
   const m=lines[i].match(/^(?:#{1,4}\s*)?\[([^\]]{10,})\]\((https?:\/\/[^)]+)\)/);
   if(!m)continue;
   const title=m[1].replace(/\s+/g," ").trim();
   const link=m[2];
   const k=norm(title);
   if(!k||seen.has(k))continue;
   if(/гласувай за|livestream|live livestream/i.test(title))continue;

   let age="",image="";
   // Only use an image explicitly in the immediate article block.
   for(let j=i+1;j<Math.min(i+4,lines.length);j++){
     if(/^(?:#{1,4}\s*)?\[/.test(lines[j]))break;
     const im=lines[j].match(/!\[[^\]]*\]\((https?:\/\/[^)\s]+)\)/);
     if(im&&!image)image=im[1];
     const ag=lines[j].match(/преди\s+\d+\s+(?:минути|минута|часа|час|дни|ден)/i);
     if(ag)age=ag[0];
   }
   seen.add(k);result.push({title,link,age,image});
 }
 return result;
}

async function loadAll(){
 const root=document.getElementById("news"),status=document.getElementById("status");
 root.innerHTML="";status.textContent="Зареждане на последните новини…";
 let total=0;
 for(const source of SOURCES){
   const card=document.createElement("section");card.className="card";
   card.innerHTML="<h2>"+esc(source.title)+"</h2><div class='items'><div class='loading'>Зареждане…</div></div>";
   root.appendChild(card);
   try{
     const items=extract(await readPage(source.url),source);
     card.querySelector(".items").innerHTML=items.map(x=>
       "<a class='item' href='"+esc(x.link)+"' target='_blank' rel='noopener'>"+
       (x.image?"<img class='thumb' src='"+esc(x.image)+"' alt='' loading='lazy' onerror=\"this.remove()\">":"")+
       "<div class='body'><strong>"+esc(x.title)+"</strong><span>"+esc(x.age||"Последна публикация")+"</span></div></a>"
     ).join("")||"<div class='loading'>Не са намерени новини.</div>";
     total+=items.length;
   }catch(e){
     card.querySelector(".items").innerHTML="<div class='error'>Временно не могат да се заредят новините.</div>";
   }
 }
 status.textContent="Последно обновяване: "+new Date().toLocaleTimeString("bg-BG")+" • "+total+" заглавия";
}
loadAll();
setInterval(loadAll,300000);
</script>
</body>
</html>
