<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🇧🇬 Български новини</title>
<style>
:root{--bg:#061f2d;--card:#082737;--line:#00c8ff;--text:#f4f7fa;--muted:#9db5c3;--accent:#ff9d9d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
main{max-width:1500px;margin:0 auto;padding:54px 36px 70px}
h1{font-size:42px;margin:0 0 12px;font-weight:800}
.subtitle{font-size:23px;color:var(--muted);margin-bottom:12px}
.status{font-size:17px;color:var(--muted);margin-bottom:32px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:32px}
.card{border:2px solid var(--line);border-radius:30px;padding:28px 30px;min-height:520px;background:rgba(8,39,55,.45)}
.card h2{font-size:32px;margin:0 0 20px}
.item{padding:15px 0;border-bottom:1px solid rgba(157,181,195,.22)}
.item:last-child{border-bottom:0}
.item a{color:var(--text);text-decoration:none;font-size:21px;font-weight:650;line-height:1.3}
.item a:hover{text-decoration:underline}
.time{display:block;color:var(--muted);font-size:14px;margin-top:7px}
.error{color:var(--accent);font-size:18px}
@media(max-width:900px){.grid{grid-template-columns:1fr}main{padding:28px 18px}h1{font-size:34px}.subtitle{font-size:19px}.card{min-height:auto}}
</style>
</head>
<body>
<main>
  <h1>🇧🇬 Български новини</h1>
  <div class="subtitle">Последни публикации от DarikNews.bg и dsport.bg · без RSS · автоматично обновяване</div>
  <div class="status" id="status">Зареждане...</div>

  <div class="grid">
    <section class="card">
      <h2>📰 Новини</h2>
      <div id="news"><div class="error">Зареждане...</div></div>
    </section>

    <section class="card">
      <h2>⚽ Спорт</h2>
      <div id="sport"><div class="error">Зареждане...</div></div>
    </section>
  </div>
</main>

<script>
async function loadNews(){
  try{
    const r = await fetch("news.json?t=" + Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error("HTTP " + r.status);
    const data = await r.json();

    render("news", data.news || []);
    render("sport", data.sport || []);

    const updated = data.updated
      ? new Date(data.updated).toLocaleString("bg-BG",{dateStyle:"short",timeStyle:"medium"})
      : "няма данни";
    document.getElementById("status").textContent =
      "Последна проверка: " + updated + " · страницата проверява за нови данни на всеки 5 минути";
  }catch(e){
    document.getElementById("status").textContent = "Неуспешно зареждане на news.json";
    document.getElementById("news").innerHTML = '<div class="error">Новините временно не могат да се заредят.</div>';
    document.getElementById("sport").innerHTML = '<div class="error">Спортните новини временно не могат да се заредят.</div>';
  }
}

function render(id, items){
  const el=document.getElementById(id);
  if(!items.length){
    el.innerHTML='<div class="error">Все още няма изтеглени новини. Стартирайте GitHub Action „Update news“.</div>';
    return;
  }
  el.innerHTML=items.map(x=>{
    const title=escapeHtml(x.title||"Без заглавие");
    const url=escapeAttr(x.url||"#");
    const time=escapeHtml(x.time||"");
    return `<div class="item"><a href="${url}" target="_blank" rel="noopener">${title}</a>${time?`<span class="time">${time}</span>`:""}</div>`;
  }).join("");
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function escapeAttr(s){return escapeHtml(s);}
loadNews();
setInterval(loadNews, 5*60*1000);
</script>
</body>
</html>
