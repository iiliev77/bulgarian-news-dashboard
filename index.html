<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#07101d">
<title>🇧🇬 Български новини</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#07101d;color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{padding:28px 24px 50px}
.wrap{max-width:1100px;margin:auto}
header{display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:2px solid #30415a;padding:8px 0 24px;margin-bottom:26px}
h1{font-size:48px;margin:0;font-weight:800;letter-spacing:-1px}
.clock{font-size:34px;font-weight:700;white-space:nowrap}
.status{font-size:24px;color:#9eabc0;margin-top:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
section{border:4px solid #30415a;border-radius:34px;padding:30px 28px;min-height:420px}
.section-title{font-size:38px;font-weight:800;margin:0 0 22px}
.source{font-size:18px;color:#9eabc0;margin:-12px 0 20px}
ul{list-style:none;padding:0;margin:0}
li{padding:17px 0;border-bottom:1px solid #26364c}
li:last-child{border-bottom:0}
a{color:#f4f7fb;text-decoration:none;font-size:27px;line-height:1.25;font-weight:650}
.time{display:block;color:#9eabc0;font-size:17px;margin-top:7px}
.error{color:#ffb2b2;font-size:22px;line-height:1.35;padding-top:12px}
.small{font-size:18px;color:#8290a6;margin-top:25px}
@media(max-width:800px){
 body{padding:20px 16px 40px}
 h1{font-size:38px}.clock{font-size:28px}.status{font-size:21px}
 .grid{grid-template-columns:1fr}
 section{padding:24px 22px}
 .section-title{font-size:34px}
 a{font-size:24px}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>🇧🇬 Български новини</h1>
    <div id="status" class="status">Зареждане…</div>
  </div>
  <div id="clock" class="clock">--:--</div>
</header>

<div class="grid">
<section>
  <h2 class="section-title">📰 Новини</h2>
  <div class="source">DarikNews.bg</div>
  <ul id="news"><li class="error">Зареждане на последните новини…</li></ul>
</section>

<section>
  <h2 class="section-title">⚽ Спорт</h2>
  <div class="source">Gong.bg</div>
  <ul id="sport"><li class="error">Зареждане на последните спортни новини…</li></ul>
</section>
</div>

<div class="small">Автоматично обновяване: всяка 1 минута • Без снимки</div>
</div>

<script>
const PROXY = "https://api.allorigins.win/raw?url=";
const SOURCES = {
  news: {
    page:"https://dariknews.bg/novini",
    home:"https://dariknews.bg/",
    cache:"bg-news-darik-v4"
  },
  sport: {
    page:"https://gong.bg/",
    home:"https://gong.bg/",
    cache:"bg-news-gong-v4"
  }
};

function esc(s){
  const d=document.createElement("div"); d.textContent=s||""; return d.innerHTML;
}

function cleanText(s){
  return (s||"").replace(/\s+/g," ").replace(/Гласувай за Играч на мача\..*$/i,"").trim();
}

function isArticle(url, type){
  try{
    const u=new URL(url);
    if(!/^https?:$/.test(u.protocol)) return false;
    if(type==="news"){
      return u.hostname.endsWith("dariknews.bg") &&
        !/\/(search|authors|avtori|category|tag|terms|login|register|video|gallery|rss|feed)(\/|$)/i.test(u.pathname) &&
        u.pathname.split("/").filter(Boolean).length>=2;
    }
    return u.hostname.endsWith("gong.bg") &&
      !/\/(forum|player|streaming|tv|games|search|terms|login|register)(\/|$)/i.test(u.pathname) &&
      u.pathname.split("/").filter(Boolean).length>=2;
  }catch(e){return false}
}

function parsePage(text,type){
  const doc=new DOMParser().parseFromString(text,"text/html");
  const out=[], seen=new Set();

  // Prefer headings containing article links.
  const candidates=[...doc.querySelectorAll("h1 a,h2 a,h3 a,h4 a,article a")];
  for(const a of candidates){
    const href=a.href, title=cleanText(a.textContent);
    if(!title || title.length<12 || !isArticle(href,type)) continue;
    const key=href.split("#")[0];
    if(seen.has(key)) continue;
    seen.add(key);
    let time="";
    const box=a.closest("article,li,div");
    if(box){
      const t=box.querySelector("time");
      if(t) time=cleanText(t.textContent);
    }
    out.push({title,href:key,time});
    if(out.length>=10) break;
  }

  // Fallback: any qualifying link with useful text.
  if(out.length<5){
    for(const a of doc.querySelectorAll("a[href]")){
      const href=a.href, title=cleanText(a.textContent);
      if(!title || title.length<18 || !isArticle(href,type)) continue;
      const key=href.split("#")[0];
      if(seen.has(key)) continue;
      seen.add(key);
      out.push({title,href:key,time:""});
      if(out.length>=10) break;
    }
  }
  return out;
}

async function fetchSource(type){
  const s=SOURCES[type];
  const target=PROXY+encodeURIComponent(s.page);
  const r=await fetch(target,{cache:"no-store"});
  if(!r.ok) throw new Error("HTTP "+r.status);
  const text=await r.text();
  const items=parsePage(text,type);
  if(items.length<3) throw new Error("Няма достатъчно новини");
  localStorage.setItem(s.cache,JSON.stringify({at:Date.now(),items}));
  return items;
}

function render(type,items){
  const el=document.getElementById(type);
  el.innerHTML=items.map(x=>`<li><a href="${esc(x.href)}" target="_blank" rel="noopener">${esc(x.title)}</a>${x.time?`<span class="time">${esc(x.time)}</span>`:""}</li>`).join("");
}

async function load(type){
  try{
    const items=await fetchSource(type);
    render(type,items);
    return true;
  }catch(e){
    try{
      const old=JSON.parse(localStorage.getItem(SOURCES[type].cache)||"null");
      if(old && old.items && old.items.length){
        render(type,old.items);
        return false;
      }
    }catch(_){}
    document.getElementById(type).innerHTML='<li class="error">В момента източникът не отговаря. Следващият опит е след 1 минута.</li>';
    return false;
  }
}

function updateClock(){
  const d=new Date();
  document.getElementById("clock").textContent=
    d.toLocaleTimeString("bg-BG",{hour:"2-digit",minute:"2-digit"});
}
updateClock(); setInterval(updateClock,1000);

async function refresh(){
  document.getElementById("status").textContent="Обновяване…";
  const results=await Promise.all([load("news"),load("sport")]);
  const now=new Date();
  document.getElementById("status").textContent=
    "Последно обновяване: "+now.toLocaleTimeString("bg-BG",{hour:"2-digit",minute:"2-digit"})+
    " • следващ опит след 1 минута";
}
refresh();
setInterval(refresh,60000);
</script>
</body>
</html>
