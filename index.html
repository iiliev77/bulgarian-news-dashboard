<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Български новини</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#061c2b;color:#eef6fb;font-family:Arial,Helvetica,sans-serif}
.wrap{max-width:1450px;margin:auto;padding:28px 30px}
h1{font-size:34px;margin:0 0 8px}
.sub{font-size:20px;color:#91aec0;margin-bottom:8px}
.status{color:#7898ab;font-size:14px;margin-bottom:25px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.box{border:2px solid #00a9e8;border-radius:28px;padding:25px 28px;background:#092337}
.box h2{font-size:32px;margin:0 0 18px}
.item{padding:16px 0;border-bottom:1px solid #173c52}
.item:last-child{border-bottom:0}
.item a{color:#eef6fb;text-decoration:none;font-size:20px;font-weight:700;line-height:1.25}
.source{color:#77a1b8;margin-top:8px;font-size:15px}
.err{color:#ffb4b4;padding:10px 0}
@media(max-width:800px){.grid{grid-template-columns:1fr}.wrap{padding:18px}.box{padding:20px}.item a{font-size:18px}}
</style>
</head>
<body>
<div class="wrap">
<h1>🇧🇬 Български новини</h1>
<div class="sub">Последни публикации от DarikNews.bg и Gong.bg · без RSS · автоматично обновяване</div>
<div class="status" id="status">Зареждане...</div>

<div class="grid">
<section class="box">
<h2>📰 Новини</h2>
<div id="news">Зареждане...</div>
</section>
<section class="box">
<h2>⚽ Спорт</h2>
<div id="sport">Зареждане...</div>
</section>
</div>
</div>

<script>
const NEWS_URL='https://dariknews.bg/rss';
const SPORT_URL='https://gong.bg/rss';

function cleanText(s){
  if(!s)return '';
  s=s.replace(/!\[[^\]]*\]\([^)]*\)/g,'');
  s=s.replace(/\[([^\]]+)\]\([^)]*\)/g,'$1');
  s=s.replace(/https?:\/\/\S+/g,'');
  s=s.replace(/<[^>]*>/g,' ');
  s=s.replace(/&nbsp;/gi,' ');
  s=s.replace(/&amp;/gi,'&').replace(/&quot;/gi,'"').replace(/&#39;/g,"'");
  return s.replace(/\s+/g,' ').trim();
}

function getItems(xml){
  const doc=new DOMParser().parseFromString(xml,'text/xml');
  return [...doc.querySelectorAll('item')].map(x=>({
    title:cleanText(x.querySelector('title')?.textContent),
    link:x.querySelector('link')?.textContent?.trim()||'#'
  })).filter(x=>x.title);
}

async function fetchFeed(url){
  const proxies=[
    'https://api.allorigins.win/raw?url='+encodeURIComponent(url),
    'https://corsproxy.io/?url='+encodeURIComponent(url)
  ];
  for(const p of proxies){
    try{
      const r=await fetch(p,{cache:'no-store'});
      if(r.ok){
        const t=await r.text();
        if(t.includes('<item')||t.includes('<entry')) return t;
      }
    }catch(e){}
  }
  throw new Error('feed');
}

function render(id,items,source){
  const el=document.getElementById(id);
  if(!items.length){el.innerHTML='<div class="err">Няма намерени публикации.</div>';return}
  const unique=[];
  const seen=new Set();
  for(const x of items){
    const k=x.title.toLowerCase();
    if(!seen.has(k)){seen.add(k);unique.push(x)}
    if(unique.length>=10)break;
  }
  el.innerHTML=unique.map(x=>`
    <div class="item">
      <a href="${x.link}" target="_blank" rel="noopener">${escapeHtml(x.title)}</a>
      <div class="source">${source}</div>
    </div>`).join('');
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function load(){
  document.getElementById('status').textContent='Обновяване...';
  try{
    const [n,s]=await Promise.all([fetchFeed(NEWS_URL),fetchFeed(SPORT_URL)]);
    render('news',getItems(n),'DarikNews.bg');
    render('sport',getItems(s),'Gong.bg');
    document.getElementById('status').textContent='Последно обновяване: '+new Date().toLocaleTimeString('bg-BG');
  }catch(e){
    document.getElementById('status').textContent='Временно не може да се обновят новините.';
  }
}
load();
setInterval(load,60000);
</script>
</body>
</html>
