<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta name="theme-color" content="#07101d">
<title>Български новини — Darik & Gong</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#07101d;color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.header{position:sticky;top:0;z-index:10;background:#0b1727;border-bottom:1px solid #26384d;padding:18px 24px}
.top{display:flex;justify-content:space-between;align-items:center;gap:20px}
h1{margin:0;font-size:29px;font-weight:800}.clock{font-size:25px;font-weight:700;white-space:nowrap}
.status{margin-top:7px;color:#9eacbd;font-size:14px}
.wrap{max-width:1500px;margin:auto;padding:15px 24px 40px}
.filters{display:flex;gap:8px;overflow:auto;padding-bottom:14px}
.filters button{border:1px solid #31445a;background:#102035;color:#dce6f2;border-radius:22px;padding:9px 16px;font-size:15px;white-space:nowrap}
.filters button.active{background:#edf2f7;color:#08111d;border-color:#edf2f7}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.card{display:block;background:#0e1b2c;border:1px solid #26384d;border-radius:13px;padding:15px;color:inherit;text-decoration:none}
.card:hover{background:#132238}
.meta{display:flex;justify-content:space-between;gap:10px;color:#93a5b9;font-size:13px;margin-bottom:7px}
.source{font-weight:700;color:#b7c6d6}.time{white-space:nowrap}
.title{font-size:20px;line-height:1.32;font-weight:700}
.empty{text-align:center;padding:40px;background:#0e1b2c;border-radius:13px;color:#9eacbd}
@media(max-width:800px){.grid{grid-template-columns:1fr}h1{font-size:24px}.title{font-size:18px}}
</style>
</head>
<body>
<header class="header">
  <div class="top">
    <h1>🇧🇬 Български новини</h1>
    <div id="clock" class="clock">--:--</div>
  </div>
  <div id="status" class="status">Зареждане на последните новини…</div>
</header>

<main class="wrap">
  <div class="filters">
    <button class="active" data-filter="all">Всички</button>
    <button data-filter="DarikNews">DarikNews</button>
    <button data-filter="Gong.bg">Gong.bg</button>
  </div>
  <section id="news" class="grid">
    <div class="empty">Зареждане…</div>
  </section>
</main>

<script>
/*
  САМО ДВА ИЗТОЧНИКА:
  1. DarikNews.bg
  2. Gong.bg

  Без снимки. Новините се подреждат по дата/час, най-новите първи.
*/
const FEEDS = [
  {
    name:"DarikNews",
    url:"https://news.google.com/rss/search?q=site%3Adariknews.bg&hl=bg&gl=BG&ceid=BG%3Abg"
  },
  {
    name:"Gong.bg",
    url:"https://news.google.com/rss/search?q=site%3Agong.bg&hl=bg&gl=BG&ceid=BG%3Abg"
  }
];

let items=[];
let filter="all";

function esc(s){
  return String(s||"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function clean(s){
  const d=document.createElement("div");
  d.innerHTML=s||"";
  return (d.textContent||"").replace(/\s+/g," ").trim();
}

async function fetchFeed(url){
  const proxies=[
    "https://api.allorigins.win/raw?url="+encodeURIComponent(url)+"&t="+Date.now(),
    "https://api.codetabs.com/v1/proxy?quest="+encodeURIComponent(url)
  ];
  for(const p of proxies){
    try{
      const r=await fetch(p,{cache:"no-store"});
      if(!r.ok) continue;
      const t=await r.text();
      if(t.includes("<item")||t.includes("<entry")) return t;
    }catch(e){}
  }
  throw new Error("Feed unavailable");
}

function parse(xml,source){
  const doc=new DOMParser().parseFromString(xml,"text/xml");
  return [...doc.querySelectorAll("item,entry")].map(n=>{
    const title=clean(n.querySelector("title")?.textContent||"");
    const linkEl=n.querySelector("link");
    let link=(linkEl?.getAttribute("href")||linkEl?.textContent||"").trim();

    const dateEl=n.querySelector("pubDate,published,updated");
    const d=dateEl ? new Date(dateEl.textContent.trim()) : new Date(0);

    return {
      title,
      link,
      source,
      date:isNaN(d.getTime())?new Date(0):d
    };
  }).filter(x=>x.title&&x.link);
}

function render(){
  const box=document.getElementById("news");
  const list=items.filter(x=>filter==="all"||x.source===filter);

  if(!list.length){
    box.innerHTML='<div class="empty">Няма заредени новини.</div>';
    return;
  }

  box.innerHTML=list.map(x=>{
    const time=x.date.getTime()
      ? x.date.toLocaleTimeString("bg-BG",{hour:"2-digit",minute:"2-digit"})
      : "";
    return `
      <a class="card" href="${esc(x.link)}" target="_blank" rel="noopener">
        <div class="meta">
          <span class="source">${esc(x.source)}</span>
          <span class="time">${time}</span>
        </div>
        <div class="title">${esc(x.title)}</div>
      </a>`;
  }).join("");
}

async function loadNews(){
  const status=document.getElementById("status");
  status.textContent="Обновяване на последните новини…";

  const results=await Promise.allSettled(
    FEEDS.map(async f=>parse(await fetchFeed(f.url),f.name))
  );

  let all=[];
  results.forEach(r=>{
    if(r.status==="fulfilled") all.push(...r.value);
  });

  // Премахване на повторенията по заглавие.
  const seen=new Set();
  items=all
    .sort((a,b)=>b.date-a.date)
    .filter(x=>{
      const key=x.title.toLowerCase().replace(/\s+/g," ");
      if(seen.has(key)) return false;
      seen.add(key);
      return true;
    })
    .slice(0,100);

  render();

  status.textContent=items.length
    ? "Последно обновяване: "+
      new Date().toLocaleTimeString("bg-BG",{hour:"2-digit",minute:"2-digit"})+
      " · само DarikNews и Gong.bg · най-новите първи"
    : "Новините не се заредиха. Обновете страницата.";
}

function updateClock(){
  document.getElementById("clock").textContent=
    new Date().toLocaleTimeString("bg-BG",{hour:"2-digit",minute:"2-digit"});
}

document.querySelectorAll(".filters button").forEach(button=>{
  button.addEventListener("click",()=>{
    document.querySelectorAll(".filters button")
      .forEach(b=>b.classList.remove("active"));
    button.classList.add("active");
    filter=button.dataset.filter;
    render();
  });
});

updateClock();
setInterval(updateClock,1000);

loadNews();
// Автоматично обновяване на всеки 5 минути.
setInterval(loadNews,5*60*1000);
</script>
</body>
</html>
