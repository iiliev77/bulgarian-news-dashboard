<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>🇧🇬 Български новини</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#061321;color:#eef4ff;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh}.wrap{max-width:1200px;margin:0 auto;padding:46px 28px}
h1{font-size:42px;margin:0 0 8px;font-weight:800}.sub{font-size:20px;color:#91a9c7;margin-bottom:42px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}h2{font-size:31px;margin:0 0 12px}
.card{border:2px solid #16558c;border-radius:28px;padding:24px;background:#071a2d;min-height:180px}
.item{padding:13px 0;border-bottom:1px solid #173550}.item:last-child{border-bottom:0}
a{color:#eef4ff;text-decoration:none;font-size:20px;line-height:1.35;font-weight:700}a:hover{text-decoration:underline}
.meta{color:#7895b7;font-size:14px;margin-top:6px}.status{color:#8ea9c8;font-size:15px;margin-top:24px}
.error{color:#ff8e8e;font-size:18px}.small{color:#7895b7;font-size:14px;margin-top:22px}
@media(max-width:800px){.grid{grid-template-columns:1fr}.wrap{padding:28px 18px}h1{font-size:34px}h2{font-size:27px}}
</style>
</head>
<body>
<div class="wrap">
<h1>🇧🇬 Български новини</h1>
<div class="sub">Последни публикации от DarikNews.bg и Gong.bg • без RSS • автоматично обновяване</div>
<div class="grid">
<section><h2>📰 Новини</h2><div class="card" id="news"><div class="status">Зареждане...</div></div></section>
<section><h2>⚽ Спорт</h2><div class="card" id="sport"><div class="status">Зареждане...</div></div></section>
</div>
<div class="small" id="updated">Проверка за новини...</div>
</div>
<script>
async function loadFeed(){
 const bust=Date.now();
 try{
  const r=await fetch("news.json?x="+bust,{cache:"no-store"});
  if(!r.ok)throw new Error("HTTP "+r.status);
  const data=await r.json();
  render("news",data.news||[],"DarikNews.bg");render("sport",data.sport||[],"Gong.bg");
  const d=data.updated?new Date(data.updated):new Date();
  document.getElementById("updated").textContent="Последна проверка: "+d.toLocaleString("bg-BG")+" • страницата се обновява автоматично";
 }catch(e){
  document.getElementById("news").innerHTML='<div class="error">Временно няма новини. Следващият автоматичен опит ще бъде след няколко минути.</div>';
  document.getElementById("sport").innerHTML='<div class="error">Временно няма новини. Следващият автоматичен опит ще бъде след няколко минути.</div>';
  document.getElementById("updated").textContent="Грешка при зареждане на news.json";
 }
}
function render(id,items,source){
 const box=document.getElementById(id);
 if(!items.length){box.innerHTML='<div class="error">Няма налични публикации в момента.</div>';return;}
 box.innerHTML=items.map(x=>`<div class="item"><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a><div class="meta">${x.time?esc(x.time)+" • ":""}${source}</div></div>`).join("");
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
loadFeed();setInterval(loadFeed,60000);
</script>
</body></html>
