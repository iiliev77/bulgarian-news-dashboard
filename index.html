<!DOCTYPE html>

<html lang="bg">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Български новини</title>

<style>

*{box-sizing:border-box}

html,body{

  margin:0;

  padding:0;

  width:100%;

  min-height:100%;

  font-family:Arial,Helvetica,sans-serif;

  background:#f4f6f8;

  color:#17202a;

}

body{padding:24px}

.top{

  display:flex;

  justify-content:space-between;

  align-items:flex-start;

  gap:20px;

  margin-bottom:22px;

}

.brand h1{

  margin:0;

  font-size:clamp(30px,4vw,52px);

  line-height:1.05;

}

.brand p{

  margin:8px 0 0;

  color:#66727e;

  font-size:clamp(15px,1.6vw,22px);

}

.clock{

  text-align:right;

  white-space:nowrap;

}

#time{

  font-size:clamp(32px,4vw,52px);

  font-weight:700;

}

#date{

  margin-top:3px;

  color:#66727e;

  font-size:clamp(14px,1.5vw,20px);

  text-transform:capitalize;

}

.status{

  display:flex;

  align-items:center;

  gap:8px;

  margin-bottom:18px;

  color:#66727e;

  font-size:15px;

}

.dot{

  width:9px;

  height:9px;

  border-radius:50%;

  background:#2e9d5b;

}

.grid{

  display:grid;

  grid-template-columns:repeat(2,minmax(0,1fr));

  gap:20px;

}

.section{

  background:white;

  border-radius:18px;

  padding:18px 20px 12px;

  box-shadow:0 2px 12px rgba(0,0,0,.07);

  min-width:0;

}

.section h2{

  margin:0 0 10px;

  font-size:clamp(21px,2.1vw,30px);

  border-bottom:2px solid #e9edf0;

  padding-bottom:10px;

}

.news{

  display:flex;

  align-items:center;

  gap:14px;

  text-decoration:none;

  color:inherit;

  padding:12px 4px;

  border-bottom:1px solid #edf0f2;

  border-radius:10px;

  min-height:105px;

}

.news:hover,

.news:active{

  background:#f0f4f7;

}

.news-image{

  width:145px;

  height:90px;

  flex-shrink:0;

  object-fit:cover;

  border-radius:10px;

  background:#dfe4e8;

  display:block;

}

.news-content{

  min-width:0;

  flex:1;

}

.news-title{

  font-size:clamp(17px,1.65vw,23px);

  line-height:1.25;

  font-weight:700;

}

.news-meta{

  margin-top:7px;

  color:#7a858e;

  font-size:13px;

}

.loading,.error{

  color:#7a858e;

  padding:15px 4px;

}

.footer{

  text-align:center;

  color:#89939b;

  font-size:13px;

  margin:18px 0 4px;

}

@media(max-width:800px){

  body{padding:14px}

  .grid{grid-template-columns:1fr}

  .news-image{

    width:120px;

    height:78px;

  }

}

@media(min-width:1400px){

  body{padding:30px 42px}

  .grid{gap:24px}

  .section{

    padding:22px 26px 14px;

  }

  .news{

    min-height:125px;

    gap:18px;

  }

  .news-image{

    width:170px;

    height:105px;

  }

}

</style>

</head>

<body>

<header class="top">

  <div class="brand">

    <h1>🇧🇬 Български новини</h1>

    <p>Последни новини от България и света</p>

  </div>

  <div class="clock">

    <div id="time">--:--</div>

    <div id="date">Зареждане...</div>

  </div>

</header>

<div class="status">

  <span class="dot"></span>

  <span id="statusText">Зареждане на новините...</span>

</div>

<main class="grid">

<section class="section">

<h2>📰 България</h2>

<div id="bgNews" class="loading">Зареждане...</div>

</section>

<section class="section">

<h2>🌍 Свят</h2>

<div id="worldNews" class="loading">Зареждане...</div>

</section>

<section class="section">

<h2>⚽ Спорт</h2>

<div id="sportNews" class="loading">Зареждане...</div>

</section>

<section class="section">

<h2>💻 Технологии</h2>

<div id="techNews" class="loading">Зареждане...</div>

</section>

</main>

<div class="footer">

Новините се обновяват автоматично на всеки 5 минути

</div>

<script>

/* =========================================================

   RSS ИЗТОЧНИЦИ

   ========================================================= */

const FEEDS = {

  bg:[

    "https://www.dariknews.bg/rss",

    "https://news.bg/rss",

    "https://www.actualno.com/rss"

  ],

  world:[

    "https://news.bg/rss/world",

    "https://www.actualno.com/rss/world"

  ],

  sport:[

    "https://www.sportal.bg/uploads/rss.php",

    "https://gong.bg/rss"

  ],

  tech:[

    "https://www.actualno.com/rss/technology"

  ]

};

/* =========================================================

   RSS PROXY

   ========================================================= */

const RSS_PROXY =

"https://api.rss2json.com/v1/api.json?rss_url=";

/* =========================================================

   ARTICLE PROXY

   ========================================================= */

const ARTICLE_PROXY =

"https://r.jina.ai/http://";

/* =========================================================

   НАСТРОЙКИ

   ========================================================= */

const MAX_ITEMS = 6;

/* =========================================================

   FALLBACK

   ========================================================= */

const FALLBACK_IMAGE =

"data:image/svg+xml;charset=UTF-8,"+

encodeURIComponent(`

<svg xmlns="http://www.w3.org/2000/svg"

width="800"

height="500">

<rect width="800" height="500" fill="#e9edf0"/>

<text x="400"

y="235"

text-anchor="middle"

font-family="Arial"

font-size="42"

font-weight="700"

fill="#7a858e">

БЪЛГАРСКИ НОВИНИ

</text>

<text x="400"

y="285"

text-anchor="middle"

font-family="Arial"

font-size="24"

fill="#9aa4ac">

Последни новини

</text>

</svg>

`);

/* =========================================================

   ESCAPE

   ========================================================= */

function escapeHtml(value){

  return String(value||"")

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}

/* =========================================================

   TITLE

   ========================================================= */

function cleanTitle(title){

  return String(title||"")

    .replace(/\s+/g," ")

    .trim();

}

/* =========================================================

   DATE

   ========================================================= */

function formatTime(dateString){

  if(!dateString)return"";

  const d=new Date(dateString);

  if(isNaN(d.getTime()))return"";

  return d.toLocaleString(

    "bg-BG",

    {

      day:"2-digit",

      month:"2-digit",

      hour:"2-digit",

      minute:"2-digit"

    }

  );

}

/* =========================================================

   НАМИРА СНИМКА В RSS

   ========================================================= */

function getRSSImage(item){

  let image="";

  /* thumbnail */

  if(item.thumbnail){

    image=item.thumbnail;

  }

  /* enclosure */

  if(!image && item.enclosure){

    if(typeof item.enclosure==="string"){

      image=item.enclosure;

    }

    else{

      image=

        item.enclosure.link||

        item.enclosure.url||

        "";

    }

  }

  /* media */

  if(!image && item.media){

    if(item.media.content){

      if(Array.isArray(item.media.content)){

        for(const m of item.media.content){

          if(m && m.url){

            image=m.url;

            break;

          }

        }

      }else{

        image=

          item.media.content.url||

          item.media.content.link||

          "";

      }

    }

    if(!image && item.media.thumbnail){

      if(Array.isArray(item.media.thumbnail)){

        if(item.media.thumbnail[0]){

          image=

            item.media.thumbnail[0].url||

            item.media.thumbnail[0].link||

            "";

        }

      }else{

        image=

          item.media.thumbnail.url||

          item.media.thumbnail.link||

          "";

      }

    }

  }

  /* img в description */

  if(!image){

    const html=

      item.description||

      item.content||

      "";

    const match=

      html.match(

        /<img[^>]+src=["']([^"']+)["']/i

      );

    if(match){

      image=match[1];

    }

  }

  return image||"";

}

/* =========================================================

   ВЗЕМА OG:IMAGE ОТ САМАТА СТАТИЯ

   ========================================================= */

async function getArticleImage(url){

  try{

    if(!url)return"";

    const cleanUrl=

      url.replace(/^https?:\/\//i,"");

    const proxyUrl=

      ARTICLE_PROXY+

      cleanUrl;

    const response=

      await fetch(

        proxyUrl,

        {

          cache:"no-store"

        }

      );

    if(!response.ok){

      return"";

    }

    const html=

      await response.text();

    /* og:image */

    let match=

      html.match(

        /property=["']og:image["'][^>]+content=["']([^"']+)["']/i

      );

    if(!match){

      match=

        html.match(

          /content=["']([^"']+)["'][^>]+property=["']og:image["']/i

        );

    }

    if(match && match[1]){

      return match[1]

        .replace(/&amp;/g,"&")

        .trim();

    }

    /* twitter:image */

    match=

      html.match(

        /name=["']twitter:image["'][^>]+content=["']([^"']+)["']/i

      );

    if(!match){

      match=

        html.match(

          /content=["']([^"']+)["'][^>]+name=["']twitter:image["']/i

        );

    }

    if(match && match[1]){

      return match[1]

        .replace(/&amp;/g,"&")

        .trim();

    }

  }catch(error){

    console.log(

      "Неуспешно извличане на снимка:",

      url

    );

  }

  return"";

}

/* =========================================================

   ВЗЕМА СНИМКА

   ========================================================= */

async function getBestImage(item){

  /* първо RSS */

  const rssImage=

    getRSSImage(item);

  if(rssImage){

    return rssImage;

  }

  /* след това самата статия */

  if(item.link){

    const articleImage=

      await getArticleImage(

        item.link

      );

    if(articleImage){

      return articleImage;

    }

  }

  return FALLBACK_IMAGE;

}

/* =========================================================

   RSS

   ========================================================= */

async function getFeed(url){

  const response=

    await fetch(

      RSS_PROXY+

      encodeURIComponent(url),

      {

        cache:"no-store"

      }

    );

  if(!response.ok){

    throw new Error("RSS error");

  }

  const data=

    await response.json();

  if(

    !data||

    data.status!=="ok"||

    !Array.isArray(data.items)

  ){

    throw new Error(

      "Invalid RSS response"

    );

  }

  return data.items;

}

/* =========================================================

   ПЪРВИ РАБОТЕЩ FEED

   ========================================================= */

async function getFirstWorkingFeed(feedList){

  for(const url of feedList){

    try{

      const items=

        await getFeed(url);

      if(items.length){

        return items;

      }

    }catch(e){

      console.log(

        "Feed unavailable:",

        url

      );

    }

  }

  return[];

}

/* =========================================================

   IMAGE ERROR

   ========================================================= */

function imageError(img){

  img.onerror=null;

  img.src=FALLBACK_IMAGE;

}

/* =========================================================

   RENDER

   ========================================================= */

async function renderNews(

  elementId,

  items

){

  const container=

    document.getElementById(

      elementId

    );

  if(!items.length){

    container.innerHTML=

      '<div class="error">'+

      'В момента няма налични новини.'+

      '</div>';

    return;

  }

  const seen=new Set();

  const selected=[];

  for(const item of items){

    const title=

      cleanTitle(item.title);

    const link=

      item.link;

    if(

      !title||

      !link||

      seen.has(title)

    ){

      continue;

    }

    seen.add(title);

    selected.push(item);

    if(

      selected.length>=MAX_ITEMS

    ){

      break;

    }

  }

  /* =======================================================

     ПЪРВО ПОКАЗВАМЕ ЗАГЛАВИЯТА

     ======================================================= */

  container.innerHTML=

    selected.map((item,index)=>{

      const title=

        escapeHtml(

          cleanTitle(item.title)

        );

      const link=

        escapeHtml(item.link);

      const time=

        escapeHtml(

          formatTime(item.pubDate)

        );

      return`

      <a

        class="news"

        href="${link}"

        target="_blank"

        rel="noopener noreferrer"

      >

        <img

          id="${elementId}-img-${index}"

          class="news-image"

          src="${FALLBACK_IMAGE}"

          alt=""

          onerror="imageError(this)"

        >

        <div class="news-content">

          <div class="news-title">

            ${title}

          </div>

          ${

            time

            ?

            `<div class="news-meta">${time}</div>`

            :

            ""

          }

        </div>

      </a>

      `;

    }).join("");

  /* =======================================================

     СЛЕД ТОВА ЗАРЕЖДАМЕ СНИМКИТЕ

     ======================================================= */

  await Promise.all(

    selected.map(

      async(item,index)=>{

        const image=

          await getBestImage(item);

        const img=

          document.getElementById(

            `${elementId}-img-${index}`

          );

        if(img && image){

          img.src=image;

        }

      }

    )

  );

}

/* =========================================================

   LOAD NEWS

   ========================================================= */

async function loadNews(){

  const status=

    document.getElementById(

      "statusText"

    );

  status.textContent=

    "Обновяване на новините...";

  try{

    const results=

      await Promise.all([

        getFirstWorkingFeed(

          FEEDS.bg

        ),

        getFirstWorkingFeed(

          FEEDS.world

        ),

        getFirstWorkingFeed(

          FEEDS.sport

        ),

        getFirstWorkingFeed(

          FEEDS.tech

        )

      ]);

    await Promise.all([

      renderNews(

        "bgNews",

        results[0]

      ),

      renderNews(

        "worldNews",

        results[1]

      ),

      renderNews(

        "sportNews",

        results[2]

      ),

      renderNews(

        "techNews",

        results[3]

      )

    ]);

    status.textContent=

      "Последно обновяване: "+

      new Date().toLocaleTimeString(

        "bg-BG",

        {

          hour:"2-digit",

          minute:"2-digit"

        }

      );

  }

  catch(error){

    console.error(error);

    status.textContent=

      "Новините не могат да бъдат обновени в момента.";

  }

}

/* =========================================================

   CLOCK

   ========================================================= */

function updateClock(){

  const now=

    new Date();

  document.getElementById(

    "time"

  ).textContent=

    now.toLocaleTimeString(

      "bg-BG",

      {

        hour:"2-digit",

        minute:"2-digit"

      }

    );

  document.getElementById(

    "date"

  ).textContent=

    now.toLocaleDateString(

      "bg-BG",

      {

        weekday:"long",

        day:"numeric",

        month:"long"

      }

    );

}

/* =========================================================

   START

   ========================================================= */

updateClock();

loadNews();

setInterval(

  updateClock,

  1000

);

setInterval(

  loadNews,

  300000

);

</script>

</body>

</html>
