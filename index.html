<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🇧🇬 Български новини</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#07111f;color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{padding:34px 22px 60px}
.wrap{max-width:1100px;margin:auto}
h1{font-size:54px;line-height:1.05;margin:20px 0 12px;font-weight:800}
.sub{font-size:24px;color:#9fb0c7;line-height:1.4}
.status{font-size:21px;color:#9fb0c7;margin:16px 0 22px}
button{background:#1a2a41;color:white;border:1px solid #3d5879;border-radius:16px;padding:16px 24px;font-size:22px;cursor:pointer}
.grid{display:grid;gap:22px;margin-top:35px}
.card{background:#101f32;border:2px solid #2d4666;border-radius:30px;overflow:hidden}
.card h2{margin:0;padding:25px 28px;background:#1b2d46;font-size:34px}
.items{padding:20px 26px}
.item{display:block;color:#f4f7fb;text-decoration:none;padding:17px 4px;border-bottom:1px solid #2b405a}
.item:last-child{border-bottom:0}
.item strong{display:block;font-size:22px;line-height:1.3}
.item span{display:block;color:#93a6bd;font-size:15px;margin-top:7px}
.error{color:#ffb5b5;font-size:22px;line-height:1.5;padding:30px}
.loading{color:#a9bad0;font-size:20px;padding:30px}
.small{color:#73869e;font-size:15px;margin-top:25px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🇧🇬 Български<br>новини</h1>
  <div class="sub">Актуални заглавия от български медии</div>
  <div id="status" class="status">Зареждане на новините…</div>
  <button onclick="loadAll()">↻ Обнови новините</button>
  <div id="news" class="grid"></div>
  <div class="small">Заглавията водят към оригиналните публикации.</div>
</div>

<script>
const API = "https://api.rss2json.com/v1/api.json?rss_url=";

const feeds = [
  {
    title:"📰 България",
    rss:"https://news.google.com/rss/search?q=site%3Adariknews.bg%2Fnovini%2Fbylgariia&hl=bg&gl=BG&ceid=BG%3Abg"
  },
  {
    title:"💼 Бизнес",
    rss:"https://news.google.com/rss/search?q=site%3Ablitz.bg%20бизнес&hl=bg&gl=BG&ceid=BG%3Abg"
  },
  {
    title:"⚽ Спорт",
    rss:"https://news.google.com/rss/search?q=site%3Agong.bg%20спорт&hl=bg&gl=BG&ceid=BG%3Abg"
  },
  {
    title:"💻 Технологии",
    rss:"https://news.google.com/rss/search?q=site%3Avesti.bg%20технологии&hl=bg&gl=BG&ceid=BG%3Abg"
  }
];

function esc(s){
  return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

function cleanTitle(s){
  return String(s||"").replace(/\s+/g," ").trim();
}

async function getFeed(feed){
  const url = API + encodeURIComponent(feed.rss);
  const r = await fetch(url,{cache:"no-store"});
  if(!r.ok) throw new Error("HTTP "+r.status);
  const data = await r.json();
  if(data.status !== "ok") throw new Error(data.message || "RSS error");
  return (data.items||[]).slice(0,8);
}

async function loadAll(){
  const news=document.getElementById("news");
  const status=document.getElementById("status");
  news.innerHTML="";
  status.textContent="Зареждане…";

  let ok=0;

  for(const feed of feeds){
    const card=document.createElement("section");
    card.className="card";
    card.innerHTML=`<h2>${feed.title}</h2><div class="items"><div class="loading">Зареждане…</div></div>`;
    news.appendChild(card);

    try{
      const items=await getFeed(feed);
      const box=card.querySelector(".items");

      if(!items.length){
        box.innerHTML='<div class="error">Няма налични заглавия в момента.</div>';
        return;
      }

      ok++;
      box.innerHTML=items.map(x=>{
        const title=cleanTitle(x.title);
        const link=x.link || "#";
        const date=x.pubDate ? new Date(x.pubDate).toLocaleString("bg-BG",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}) : "";
        return `<a class="item" href="${esc(link)}" target="_blank" rel="noopener">
          <strong>${esc(title)}</strong>
          <span>${esc(date)}</span>
        </a>`;
      }).join("");
    }catch(e){
      card.querySelector(".items").innerHTML='<div class="error">Новините временно не могат да бъдат заредени. Натиснете „Обнови новините“.</div>';
    }
  }

  status.textContent=`Заредени секции: ${ok}/${feeds.length} • Последно обновяване: ${new Date().toLocaleTimeString("bg-BG",{hour:"2-digit",minute:"2-digit"})}`;
}

loadAll();
</script>
</body>
</html>
