<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Български новини</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#f1f3f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
header{padding:34px 28px 24px;background:#171a1f;border-bottom:1px solid #30343b}
h1{margin:0 0 10px;font-size:32px}.status{color:#aeb4bd;font-size:16px}
main{max-width:1180px;margin:0 auto;padding:20px 18px 50px}section{margin:0 0 30px}
h2{font-size:24px;margin:0 0 12px;padding-bottom:10px;border-bottom:2px solid #3b82f6}
.card{background:#171a1f;border-radius:12px;padding:16px 18px;margin:10px 0}
a{color:#f3f4f6;text-decoration:none;font-size:18px;line-height:1.35}a:hover{text-decoration:underline}
.meta{color:#8f98a5;font-size:13px;margin-top:7px}.error{text-align:center;color:#e9a6a6;padding:22px}.loading{text-align:center;color:#aeb4bd;padding:22px}
@media(max-width:700px){h1{font-size:26px}h2{font-size:21px}a{font-size:16px}}
</style>
</head>
<body>
<header><h1>🇧🇬 Български новини</h1><div class="status" id="status">Зареждане...</div></header>
<main>
<section><h2>Последни новини — Darik</h2><div id="darik" class="loading">Зареждане...</div></section>
<section><h2>Спорт — Dsport.bg</h2><div id="dsport" class="loading">Зареждане...</div></section>
</main>
<script>
const DATA_URL="./news.json?ts="+Date.now();
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function render(id,items,msg){
 const el=document.getElementById(id);
 if(!items||!items.length){el.innerHTML='<div class="card error">'+esc(msg)+'</div>';return;}
 el.innerHTML=items.slice(0,15).map(x=>'<div class="card"><a href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer">'+esc(x.title)+'</a>'+(x.time?'<div class="meta">'+esc(x.time)+'</div>':'')+'</div>').join("");
}
fetch(DATA_URL,{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("HTTP "+r.status);return r.json();}).then(data=>{
 document.getElementById("status").textContent="Последна проверка: "+new Date(data.updated_at).toLocaleString("bg-BG")+" · автоматично обновяване на всеки 5 минути";
 render("darik",data.darik,"Darik няма заредени новини в момента.");
 render("dsport",data.dsport,"Dsport.bg няма заредени новини в момента.");
}).catch(err=>{
 document.getElementById("status").textContent="Грешка при зареждане на новините.";
 render("darik",[],"Новините не могат да бъдат заредени.");
 render("dsport",[],"Спортните новини не могат да бъдат заредени.");
 console.error(err);
});
setTimeout(()=>location.reload(),300000);
</script>
</body>
</html>
