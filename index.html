<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>🇧🇬 Български новини</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#06111f;color:#eef4ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{min-height:100vh}
.wrap{max-width:1050px;margin:0 auto;padding:38px 28px 50px}
h1{font-size:38px;margin:0 0 6px;font-weight:800}
.sub{font-size:18px;color:#8fa8c7;margin-bottom:30px}
h2{font-size:29px;margin:26px 0 12px}
.status{font-size:14px;color:#91afd1;margin:8px 0 20px}
.grid{display:grid;grid-template-columns:1fr;gap:16px}
.card{border:2px solid #234c7b;border-radius:30px;padding:21px 24px;background:#071523}
.source{font-size:17px;color:#91acd0;margin-bottom:14px}
.item{padding:12px 0;border-bottom:1px solid #193554}
.item:last-child{border-bottom:0}
a{color:#f2f7ff;text-decoration:none;font-size:20px;line-height:1.35}
a:hover{text-decoration:underline}
.time{font-size:13px;color:#7894b7;margin-top:6px}
.error{color:#ff9b9b;font-size:17px;line-height:1.4;padding:5px 0}
.small{color:#7894b7;font-size:14px;margin-top:22px}
@media(min-width:900px){.grid{grid-template-columns:1fr 1fr}.wrap{padding-top:48px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>🇧🇬 Български новини</h1>
  <div class="sub">Последни публикации • автоматично обновяване на всяка 1 минута</div>

  <div class="grid">
    <section>
      <h2>📰 Новини</h2>
      <div class="card">
        <div class="source">DarikNews.bg</div>
        <div id="darik"><div class="error">Зареждане…</div></div>
      </div>
    </section>

    <section>
      <h2>⚽ Спорт</h2>
      <div class="card">
        <div class="source">Gong.bg</div>
        <div id="gong"><div class="error">Зареждане…</div></div>
      </div>
    </section>
  </div>

  <div class="status" id="updated">Обновяване…</div>
  <div class="small">Без снимки • Заглавията и връзките водят към оригиналните публикации.</div>
</div>

<script>
const API="https://api.rss2json.com/v1/api.json";
const FEEDS={
  darik:{url:"https://dariknews.bg/rss.php", box:"darik", count:10},
  gong:{url:"https://gong.bg/rss", box:"gong", count:10}
};

function esc(s){
  return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function fmt(d){
  const x=new Date(d);
  if(isNaN(x)) return "";
  return x.toLocaleString("bg-BG",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
}
function render(name,data){
  const f=FEEDS[name], box=document.getElementById(f.box);
  if(!data || data.status!=="ok" || !Array.isArray(data.items) || !data.items.length){
    box.innerHTML='<div class="error">Временно няма връзка с източника. Следващият опит е автоматичен.</div>';
    return;
  }
  const items=data.items.slice().sort((a,b)=>new Date(b.pubDate)-new Date(a.pubDate)).slice(0,f.count);
  box.innerHTML=items.map(i=>{
    const title=esc(i.title);
    const link=esc(i.link);
    return `<div class="item">
      <a href="${link}" target="_blank" rel="noopener">${title}</a>
      <div class="time">${fmt(i.pubDate)}</div>
    </div>`;
  }).join("");
}
function loadFeed(name){
  const f=FEEDS[name];
  const cb="rsscb_"+name+"_"+Date.now();
  window[cb]=function(data){
    try{render(name,data)}finally{
      delete window[cb];
      const el=document.getElementById(cb);
      if(el) el.remove();
    }
  };
  const s=document.createElement("script");
  s.id=cb;
  s.src=API+"?rss_url="+encodeURIComponent(f.url)+"&count="+f.count+"&callback="+cb+"&_="+Date.now();
  s.onerror=function(){
    document.getElementById(f.box).innerHTML='<div class="error">Временно няма връзка с източника. Следващият опит е автоматичен.</div>';
    delete window[cb];
    s.remove();
  };
  document.body.appendChild(s);
}
function loadAll(){
  loadFeed("darik");
  loadFeed("gong");
  document.getElementById("updated").textContent=
    "Последно обновяване: "+new Date().toLocaleTimeString("bg-BG");
}
loadAll();
setInterval(loadAll,60000);
</script>
</body>
</html>
