<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>🇧🇬 Български новини</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#071321;color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{min-height:100vh}
header{padding:42px 22px 28px;max-width:1100px;margin:auto}
h1{font-size:42px;margin:0 0 8px;font-weight:800}
.sub{font-size:21px;color:#9eb0c5;margin-bottom:16px}
.status{font-size:17px;color:#8fa7bf}
#refresh{margin-top:18px;border:1px solid #38516d;background:#14263b;color:#fff;border-radius:12px;padding:11px 18px;font-size:16px}
main{border-top:1px solid #263b52;padding:28px 22px 50px}
.grid{max-width:1100px;margin:auto;display:grid;gap:22px}
.card{background:#0e1d2d;border:2px solid #243b55;border-radius:24px;overflow:hidden}
.title{padding:23px 26px;font-size:29px;font-weight:800;background:#15283e;border-bottom:2px solid #243b55}
.items{padding:8px 24px 18px}
.item{display:block;color:#fff;text-decoration:none;padding:17px 3px;border-bottom:1px solid #263b52}
.item:last-child{border-bottom:0}
.item:hover{background:#12263b}
.headline{font-size:20px;line-height:1.3;font-weight:650}
.meta{font-size:13px;color:#91a7bc;margin-top:7px}
.error{padding:28px 25px;color:#ffb0b0;font-size:20px;line-height:1.45}
.loading{padding:28px 25px;color:#9eb0c5;font-size:19px}
@media(max-width:600px){
 header{padding:38px 30px 25px} h1{font-size:39px}.sub{font-size:20px}
 main{padding:30px}.title{font-size:28px;padding:21px 25px}.items{padding:8px 25px 15px}
 .headline{font-size:19px}
}
</style>
</head>
<body>
<header>
  <h1>🇧🇬 Български новини</h1>
  <div class="sub">Актуални заглавия от български медии</div>
  <div class="status" id="status">Зареждане на новини…</div>
  <button id="refresh" onclick="loadAll()">↻ Обнови новините</button>
</header>

<main>
<div class="grid">

<section class="card">
  <div class="title">📰 България</div>
  <div class="items" id="bulgaria"><div class="loading">Зареждане…</div></div>
</section>

<section class="card">
  <div class="title">💼 Бизнес</div>
  <div class="items" id="business"><div class="loading">Зареждане…</div></div>
</section>

<section class="card">
  <div class="title">⚽ Спорт</div>
  <div class="items" id="sport"><div class="loading">Зареждане…</div></div>
</section>

<section class="card">
  <div class="title">🌍 Свят</div>
  <div class="items" id="world"><div class="loading">Зареждане…</div></div>
</section>

</div>
</main>

<script>
/*
  Работи като статичен GitHub Pages сайт.
  Новините се вземат през публичен CORS gateway, за да няма
  директни RSS заявки от браузъра към различни медийни сайтове.
*/

const feeds = {
  bulgaria: [
    "https://news.google.com/rss/search?q=България&hl=bg&gl=BG&ceid=BG:bg"
  ],
  business: [
    "https://news.google.com/rss/search?q=бизнес+България&hl=bg&gl=BG&ceid=BG:bg"
  ],
  sport: [
    "https://news.google.com/rss/search?q=спорт+България&hl=bg&gl=BG&ceid=BG:bg"
  ],
  world: [
    "https://news.google.com/rss/search?q=свят&hl=bg&gl=BG&ceid=BG:bg"
  ]
};

const gateways = [
  u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
  u => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u)
];

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function parseRSS(text){
  const xml = new DOMParser().parseFromString(text,"text/xml");
  if(xml.querySelector("parsererror")) throw new Error("Невалиден RSS");
  return [...xml.querySelectorAll("item")].slice(0,8).map(x => ({
    title: x.querySelector("title")?.textContent?.trim() || "Без заглавие",
    link: x.querySelector("link")?.textContent?.trim() || "#",
    date: x.querySelector("pubDate")?.textContent?.trim() || "",
    source: x.querySelector("source")?.textContent?.trim() || "Google News"
  })).filter(x => x.title && x.link);
}

async function getFeed(url){
  for(const gateway of gateways){
    try{
      const controller = new AbortController();
      const timer = setTimeout(()=>controller.abort(),9000);
      const r = await fetch(gateway(url),{
        cache:"no-store",
        signal:controller.signal
      });
      clearTimeout(timer);
      if(!r.ok) continue;
      const text = await r.text();
      const items = parseRSS(text);
      if(items.length) return items;
    }catch(e){}
  }
  throw new Error("Източникът не отговори");
}

function render(id,items){
  const box=document.getElementById(id);
  box.innerHTML=items.map(x=>`
    <a class="item" href="${esc(x.link)}" target="_blank" rel="noopener noreferrer">
      <div class="headline">${esc(x.title)}</div>
      <div class="meta">${esc(x.source)}${x.date ? " • "+esc(new Date(x.date).toLocaleString("bg-BG",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})) : ""}</div>
    </a>
  `).join("");
}

async function loadSection(id){
  const box=document.getElementById(id);
  box.innerHTML='<div class="loading">Зареждане…</div>';
  try{
    const items=await getFeed(feeds[id][0]);
    render(id,items);
    return true;
  }catch(e){
    box.innerHTML='<div class="error">Новините временно не могат да бъдат заредени.<br>Натиснете „Обнови новините“.</div>';
    return false;
  }
}

async function loadAll(){
  const status=document.getElementById("status");
  status.textContent="Зареждане на новини…";
  const results=await Promise.all(Object.keys(feeds).map(loadSection));
  const ok=results.filter(Boolean).length;
  status.textContent=`Заредени секции: ${ok}/4 • Последно обновяване: ${new Date().toLocaleTimeString("bg-BG",{hour:"2-digit",minute:"2-digit"})}`;
}

loadAll();
setInterval(loadAll, 10*60*1000);
</script>
</body>
</html>
