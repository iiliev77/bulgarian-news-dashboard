<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🇧🇬 Български новини</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#07111f;color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{padding:34px 22px 60px}.wrap{max-width:1100px;margin:auto}
h1{font-size:54px;line-height:1.05;margin:20px 0 12px;font-weight:800}
.sub{font-size:22px;color:#9fb0c7;line-height:1.4}
.status{font-size:20px;color:#9fb0c7;margin:16px 0 22px}
button{background:#1a2a41;color:white;border:1px solid #3d5879;border-radius:16px;padding:16px 24px;font-size:22px;cursor:pointer}
.grid{display:grid;gap:22px;margin-top:35px}
.card{background:#101f32;border:2px solid #2d4666;border-radius:30px;overflow:hidden}
.card h2{margin:0;padding:25px 28px;background:#1b2d46;font-size:32px}
.items{padding:20px 26px}.item{display:flex;gap:18px;align-items:flex-start;color:#f4f7fb;text-decoration:none;padding:17px 4px;border-bottom:1px solid #2b405a}.thumb{width:190px;height:110px;object-fit:cover;border-radius:14px;flex:0 0 190px;background:#17283d}.itembody{min-width:0}
.item:last-child{border-bottom:0}.item strong{display:block;font-size:22px;line-height:1.3}
.item span{display:block;color:#93a6bd;font-size:15px;margin-top:7px}
.error{color:#ffb5b5;font-size:20px;line-height:1.5;padding:30px}.loading{color:#a9bad0;font-size:20px;padding:30px}
.small{color:#73869e;font-size:15px;margin-top:25px}
</style>
</head>
<body>
<div class="wrap">
<h1>🇧🇬 Български<br>новини</h1>
<div class="sub">Последни новини директно от DarikNews и Gong.bg • автоматично обновяване на 5 минути</div>
<div id="status" class="status">Зареждане…</div>
<button onclick="loadAll()">↻ Обнови новините</button>
<div id="news" class="grid"></div>
<div class="small">Показват се последните публикации със снимки, когато източникът предоставя изображение.</div>
</div>

<script>
const SOURCES = [
  {title:"📰 DarikNews — последни новини", url:"https://dariknews.bg/novini"},
  {title:"⚽ Gong.bg — последни спортни новини", url:"https://gong.bg/"}
];

// Jina Reader връща актуалната страница като Markdown и позволява GitHub Pages
// да я прочете без Cloudflare Worker.
const READER = "https://r.jina.ai/http://";

function esc(s){
  return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

function normalizeTitle(s){
  return String(s||"")
    .toLowerCase()
    .replace(/<[^>]*>/g,"")
    .replace(/[^a-zа-я0-9]+/gi," ")
    .replace(/\\s+/g," ")
    .trim();
}

function parseRelative(text){
  const m=text.match(/преди\s+(\d+)\s+(минути|минута|часа|час|дни|ден)/i);
  if(!m) return null;
  const n=Number(m[1]);
  if(/час/i.test(m[2])) return n*60;
  if(/ден/i.test(m[2])) return n*1440;
  return n;
}

function parseMarkdown(md, source){
  const lines=md.split(/\r?\n/);
  const out=[];
  const seen=new Set();

  for(let i=0;i<lines.length && out.length<15;i++){
    const m=lines[i].match(/^###?\s*\[([^\]]{8,})\]\((https?:\/\/[^)]+)\)/);
    if(!m) continue;

    const title=m[1].replace(/\s+/g," ").trim();
    const link=m[2];
    if(seen.has(link) || /гласувай за играч|livestream/i.test(title)) continue;

    let image="";
    let age="";

    // Only inspect the immediate card neighborhood, stopping at the next
    // headline. This prevents Darik's next/previous story image being attached.
    for(let j=i-1;j<=i+2 && j<lines.length;j++){
      if(j!==i && /^###?\s*\[/.test(lines[j])) break;

      const im=lines[j].match(/!\[[^\]]*\]\((https?:\/\/[^)\s]+)\)/);
      if(im) image=im[1];

      const ageMatch=lines[j].match(/преди\s+\d+\s+(?:минути|минута|часа|час|дни|ден)/i);
      if(ageMatch) age=ageMatch[0];
    }

    // If no image is explicitly attached to this card, do not guess.
    seen.add(link);
    out.push({title,link,age,image});
  }
  return out;
}

async function fetchSource(source){
  const target=source.url.replace(/^https?:\/\//,"");
  const url=READER+target+"?v="+Date.now();
  const r=await fetch(url,{cache:"no-store"});
  if(!r.ok) throw new Error("HTTP "+r.status);
  const md=await r.text();
  const items=parseMarkdown(md,source);
  if(!items.length) throw new Error("Не са намерени новини");
  return items;
}

async function loadAll(){
  const news=document.getElementById("news");
  const status=document.getElementById("status");
  const globalSeen = new Set();
  news.innerHTML="";
  status.textContent="Зареждане на последните новини…";
  let ok=0;

  for(const source of SOURCES){
    const card=document.createElement("section");
    card.className="card";
    card.innerHTML=`<h2>${esc(source.title)}</h2><div class="items"><div class="loading">Зареждане…</div></div>`;
    news.appendChild(card);

    try{
      const items=(await fetchSource(source)).filter(x=>{
        const key=normalizeTitle(x.title);
        const url=String(x.link||"").split("?")[0].replace(/\\/$/,"");
        const duplicate = globalSeen.has(key) || (url && globalSeen.has("url:"+url));
        if(!duplicate){
          globalSeen.add(key);
          if(url) globalSeen.add("url:"+url);
        }
        return !duplicate;
      });
      card.querySelector(".items").innerHTML=items.length ? items.map(x=>`
        <a class="item" href="${esc(x.link)}" target="_blank" rel="noopener">
          ${x.image ? `<img class="thumb" src="${esc(x.image)}" alt="" loading="lazy" onerror="this.style.display='none'">` : ""}
          <div class="itembody">
            <strong>${esc(x.title)}</strong>
            <span>${esc(x.age || "последни новини")}</span>
          </div>
        </a>`).join("") : '<div class="loading">Няма други нови заглавия.</div>';
      ok++;
    }catch(e){
      card.querySelector(".items").innerHTML=`<div class="error">Временно не могат да се заредят последните новини. Натиснете „Обнови новините“.</div>`;
    }
  }

  status.textContent=`Обновено: ${new Date().toLocaleTimeString("bg-BG",{hour:"2-digit",minute:"2-digit",second:"2-digit"})} • ${ok}/${SOURCES.length} източника`;
}

loadAll();
setInterval(loadAll, 5*60*1000);
</script>
</body>
</html>
